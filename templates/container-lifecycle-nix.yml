devguard:push_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: false == "true"
      when: never
    - when: on_success
  script: |
    crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    # Strip any "@sha256:..." digest suffix: the build job exports IMAGE_TAG as
    # "repo:tag@digest", and "crane push" against a tag+digest reference pushes by
    # digest only, never creating the tag that downstream jobs (manifest/sign/attest) need.
    IMAGE_REF="$IMAGE_TAG"
    BUILT_DIGEST=""
    case "$IMAGE_REF" in
      *@*) BUILT_DIGEST="${IMAGE_REF#*@}" ;;
    esac
    IMAGE_REF=$(echo "${IMAGE_REF%@*}" | tr '[:upper:]' '[:lower:]')

    echo "Image: image.tar"
    echo "Image Tag: ${IMAGE_REF}"

    # crane push prints the pushed reference with the digest it computed locally (repository@sha256:...) on stdout
    PUSHED=$(crane push image.tar "${IMAGE_REF}")
    echo "Pushed ${PUSHED}"

    # sign, attest and provenance name the digest the build computed (IMAGE_TAG=repository:tag@digest)
    if [ -n "$BUILT_DIGEST" ] && [ "${PUSHED#*@}" != "$BUILT_DIGEST" ]; then
      echo "ERROR: crane computed ${PUSHED#*@} for the pushed image, but the build computed $BUILT_DIGEST - signatures and attestations would name a different image."
      exit 1
    fi

    # the multi-arch manifest job references the pushed image by this digest
    echo "${PUSHED#*@}" > image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt
  artifacts:
    paths:
      - image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt
devguard:sign_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:push_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  script:
    - devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - |-
      IMAGE_REF="$IMAGE_TAG"
      PUSHED_DIGEST_FILE="image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt"
      if [ -n "$PUSHED_DIGEST_FILE" ]; then
        case "$IMAGE_REF" in
          *@*) ;;
          *)
            if [ ! -f "$PUSHED_DIGEST_FILE" ]; then
              echo "$PUSHED_DIGEST_FILE not found - this pipeline pushed no image (e.g. a merge request pipeline), nothing to do"
              exit 0
            fi
            IMAGE_REF="$IMAGE_REF@$(cat "$PUSHED_DIGEST_FILE")"
            ;;
        esac
      fi
      echo "Image: $IMAGE_REF"
      devguard-scanner sign --token="$[[ inputs.devguard_token ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --assetName="$[[ inputs.devguard_asset_name ]]" "$IMAGE_REF"
devguard:attest$[[ inputs.job_suffix ]]:
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:provenance$[[ inputs.job_suffix ]]
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
    - job: devguard:build_oci_image$[[ inputs.job_suffix ]]
      artifacts: false
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:provenance$[[ inputs.job_suffix ]]
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:push_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  script: |
    IMAGE_REF="$IMAGE_TAG"
    PUSHED_DIGEST_FILE="image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt"
    if [ -n "$PUSHED_DIGEST_FILE" ]; then
      case "$IMAGE_REF" in
        *@*) ;;
        *)
          if [ ! -f "$PUSHED_DIGEST_FILE" ]; then
            echo "$PUSHED_DIGEST_FILE not found - this pipeline pushed no image (e.g. a merge request pipeline), nothing to do"
            exit 0
          fi
          IMAGE_REF="$IMAGE_REF@$(cat "$PUSHED_DIGEST_FILE")"
          ;;
      esac
    fi
    echo "Image: $IMAGE_REF"
    echo "Attesting artifacts for $IMAGE_REF"
    echo "Artifact Name: $ARTIFACT_NAME"
    echo "Asset Name: $[[ inputs.devguard_asset_name ]]"

    # URL encode artifact name for API calls
    API_ARTIFACT_NAME=$(python3 -c "from urllib.parse import quote; print(quote('$ARTIFACT_NAME', safe=''))")
    echo "API Encoded Artifact Name: $API_ARTIFACT_NAME"

    # URL encode commit ref for API calls (DevGuard resolves the ref by its name)
    API_COMMIT_REF=$(jq -rn --arg ref "$[[ inputs.commit_ref ]]" '$ref | @uri')
    echo "API Encoded Commit Ref: $API_COMMIT_REF"

    # Login to registry
    devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    echo 'Attestations: [{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/artifacts/ARTIFACT_NAME/sbom.json/","predicate_type":"https://cyclonedx.org/bom"},{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/artifacts/ARTIFACT_NAME/vex.json/","predicate_type":"https://cyclonedx.org/vex"},{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/sarif.json/","predicate_type":"https://www.schemastore.org/schemas/json/sarif-2.1.0.json"}]'

    ATT_JSON_CLEAN=$(echo '[{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/artifacts/ARTIFACT_NAME/sbom.json/","predicate_type":"https://cyclonedx.org/bom"},{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/artifacts/ARTIFACT_NAME/vex.json/","predicate_type":"https://cyclonedx.org/vex"},{"source":"$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/COMMIT_REF/sarif.json/","predicate_type":"https://www.schemastore.org/schemas/json/sarif-2.1.0.json"}]' \
    | sed 's/:\([a-z_]\+\)=>/"\1":/g' \
    | sed 's/=>/:/g' \
    | sed "s/'/\"/g")

    ATTESTATIONS_JSON=$(echo "$ATT_JSON_CLEAN" | jq . )

    # Process each attestation
    echo "$ATTESTATIONS_JSON" | jq -c '.[]' | while read -r attestation; do
      SOURCE=$(echo "$attestation" | jq -r '.source')
      PREDICATE_TYPE=$(echo "$attestation" | jq -r '.predicate_type')

      echo ""
      echo "========================================"
      echo "Processing attestation with predicate: $PREDICATE_TYPE"
      SOURCE=$(echo "$SOURCE" | envsubst)

      # Check if source is a URL (starts with http:// or https://)
      if [[ "$SOURCE" =~ ^https?:// ]]; then
        # Replace ARTIFACT_NAME placeholder with URL-encoded artifact name
        URL="${SOURCE//ARTIFACT_NAME/$API_ARTIFACT_NAME}"

        # Replace COMMIT_REF placeholder with URL-encoded commit ref
        URL="${URL//COMMIT_REF/$API_COMMIT_REF}"

        # Also handle any environment variable substitution
        URL=$(echo "$URL" | envsubst | sed -E 's#/organizations/([^/]+)/([^/]+)/([^/]+)/refs/#/organizations/\1/projects/\2/assets/\3/refs/#')

        # Extract filename from URL or use a default
        FILENAME=$(basename "$URL" | cut -d'?' -f1)
        if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ]; then
          FILENAME="downloaded-$(echo "$PREDICATE_TYPE" | md5sum | cut -d' ' -f1).json"
        fi

        echo "Downloading from URL: $URL"
        echo "Saving as: $FILENAME"

        devguard-scanner curl "$URL" --token="$[[ inputs.devguard_token ]]" > "/tmp/$FILENAME"
        FILE_PATH="/tmp/$FILENAME"
      else
        # It's a file path
        FILE_PATH="$SOURCE"
        echo "Using local file: $FILE_PATH"
      fi

      # Create attestation
      if [ -f "$FILE_PATH" ]; then
        echo "Creating attestation for $FILE_PATH"
        devguard-scanner attest "$FILE_PATH" \
          --predicateType="$PREDICATE_TYPE" \
          "$IMAGE_REF" \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --artifactName="$ARTIFACT_NAME"
        echo "✓ Attestation created successfully"
      else
        echo "✗ Warning: File $FILE_PATH not found, skipping attestation"
      fi
      echo "========================================"
    done

    # the build provenance signed by the provenance job - attached as-is to the image its signed subject names
    if [ -f "provenance.dsse.json" ]; then
      PROVENANCE_SUBJECT=$(jq -r '.payload' provenance.dsse.json | base64 -d | jq -r '.subject[0] | .name + "@sha256:" + .digest.sha256')
      echo "Attaching build provenance to $PROVENANCE_SUBJECT"
      devguard-scanner attest provenance.dsse.json "$PROVENANCE_SUBJECT" \
        --predicateType="https://slsa.dev/provenance/v1" \
        --defaultRef="$[[ inputs.default_ref ]]" \
        --ref="$[[ inputs.commit_ref ]]" \
        --isTag="$[[ inputs.is_tag ]]" \
        --token="$[[ inputs.devguard_token ]]" \
        --apiUrl="$[[ inputs.devguard_api_url ]]" \
        --assetName="$[[ inputs.devguard_asset_name ]]" \
        --artifactName="$ARTIFACT_NAME"
    fi

    echo ""
    echo "All attestations completed"
devguard:provenance$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
