include: []
devguard:generate_tag$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  variables:
    GIT_STRATEGY: fetch
    IMAGE_SUFFIX: $[[ inputs.image_suffix ]]
    DEVGUARD_ARTIFACT_NAME: $[[ inputs.devguard_artifact_name ]]
    ENV_FILENAME: generate_tag_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].env
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script: |
    echo "Running generate-tag job..."
    devguard-scanner generate-tag --imageSuffix "$IMAGE_SUFFIX" --imageVariant "$[[ inputs.image_variant ]]" --architecture "$[[ inputs.architecture ]]" --imagePath "$[[ inputs.image_path ]]" --ref "$CI_COMMIT_REF_NAME" --upstreamVersion "$[[ inputs.upstream_version ]]" >> ${ENV_FILENAME}
    echo "Tag generation completed. Generated tags:"
    cat ${ENV_FILENAME}
    echo "Filename: ${ENV_FILENAME}"
  artifacts:
    reports:
      dotenv: ${ENV_FILENAME}
    paths:
      - ${ENV_FILENAME}
devguard:container_scanning$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  variables:
    GIT_STRATEGY: fetch
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script:
    - echo "Running DevGuard Container Scanning..."
    - 'echo "Image Tag: $[[ inputs.image_tag ]]"'
    - 'echo "Image Tar Path: $[[ inputs.image_tar_path ]]"'
    - 'echo "Fetch Image From Registry: $[[ inputs.fetch_image_from_registry ]]"'
    - 'echo "Origin: $[[ inputs.devguard_origin ]]"'
    - 'echo "Asset Name: $[[ inputs.devguard_asset_name ]]"'
    - 'echo "API URL: $[[ inputs.devguard_api_url ]]"'
    - 'echo "Path: $[[ inputs.image_tar_path ]]"'
    - 'echo "Default Ref: $[[ inputs.default_ref ]]"'
    - 'echo "Commit Ref: $[[ inputs.commit_ref ]]"'
    - 'echo "Is Tag: $[[ inputs.is_tag ]]"'
    - 'echo "Artifact Name: $ARTIFACT_NAME"'
    - 'echo "Web UI: $[[ inputs.devguard_web_ui ]]"'
    - 'echo "Fail on Risk: $[[ inputs.fail_on_risk ]]"'
    - 'echo "Fail on CVSS: $[[ inputs.fail_on_cvss ]]"'
    - |-
      echo "---"
      if [ "$[[ inputs.fetch_image_from_registry ]]" = "true" ]; then
          echo "Scanning remote image from registry: $IMAGE_TAG"
          devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
          devguard-scanner container-scanning \
              --origin="$[[ inputs.devguard_origin ]]" \
              --assetName="$[[ inputs.devguard_asset_name ]]" \
              --apiUrl="$[[ inputs.devguard_api_url ]]" \
              --token="$[[ inputs.devguard_token ]]" \
              --image="$IMAGE_TAG" \
              --defaultRef="$[[ inputs.default_ref ]]" \
              --ref="$[[ inputs.commit_ref ]]" \
              --isTag="$[[ inputs.is_tag ]]" \
              --artifactName="$ARTIFACT_NAME" \
              --webUI="$[[ inputs.devguard_web_ui ]]" \
              --failOnRisk="$[[ inputs.fail_on_risk ]]" \
              --failOnCVSS="$[[ inputs.fail_on_cvss ]]" \
              --ignoreExternalReferences=$[[ inputs.ignore_external_references ]] \
              --ignoreUpstreamAttestations=$[[ inputs.ignore_upstream_attestations ]] \
              -- $[[ inputs.extra_args ]]
      elif [ -n "$[[ inputs.image_tag ]]" ]; then
        echo "Scanning remote image: $[[ inputs.image_tag ]]"
        devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
        devguard-scanner container-scanning \
          --origin="$[[ inputs.devguard_origin ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --image="$[[ inputs.image_tag ]]" \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --artifactName="$ARTIFACT_NAME" \
          --webUI="$[[ inputs.devguard_web_ui ]]" \
          --failOnRisk="$[[ inputs.fail_on_risk ]]" \
          --failOnCVSS="$[[ inputs.fail_on_cvss ]]" \
          --ignoreExternalReferences=$[[ inputs.ignore_external_references ]] \
          --ignoreUpstreamAttestations=$[[ inputs.ignore_upstream_attestations ]] \
          -- $[[ inputs.extra_args ]]
      else
        echo "Scanning local tar file: $[[ inputs.image_tar_path ]]"
        devguard-scanner container-scanning \
          --origin="$[[ inputs.devguard_origin ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --path="$[[ inputs.image_tar_path ]]" \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --artifactName="$ARTIFACT_NAME" \
          --webUI="$[[ inputs.devguard_web_ui ]]" \
          --failOnRisk="$[[ inputs.fail_on_risk ]]" \
          --failOnCVSS="$[[ inputs.fail_on_cvss ]]" \
          -- $[[ inputs.extra_args ]]
      fi
devguard:push_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: registry.gitlab.com/l3montree/devguard/osscontainertools-kaniko-crane:kaniko-v1.28.3-devguard-scanner-v1.12.4@sha256:07b0db85f1fe98a8ce05cc1855649d9e758cea3ebb40e98b6282148b48c1a350
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $[[ inputs.disable_job ]] == "true"
      when: never
    - when: on_success
  script: |
    /crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    # Strip any "@sha256:..." digest suffix: the build job exports IMAGE_TAG as
    # "repo:tag@digest", and "crane push" against a tag+digest reference pushes by
    # digest only, never creating the tag that downstream jobs (manifest/sign/attest) need.
    IMAGE_REF="$IMAGE_TAG"
    IMAGE_REF="${IMAGE_REF%@*}"
    IMAGE_REF=$(echo "${IMAGE_REF}" | tr '[:upper:]' '[:lower:]')

    echo "Image: image.tar"
    echo "Image Tag: ${IMAGE_REF}"

    /crane push image.tar "${IMAGE_REF}"
devguard:sign_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - devguard:push_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  script:
    - devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - devguard-scanner sign --token="$[[ inputs.devguard_token ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --assetName="$[[ inputs.devguard_asset_name ]]" "$IMAGE_TAG"
devguard:attest$[[ inputs.job_suffix ]]:
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  variables:
    GIT_STRATEGY: none
  script: |
    echo "Attesting artifacts for $IMAGE_TAG"
    echo "Artifact Name: $ARTIFACT_NAME"
    echo "Asset Name: $[[ inputs.devguard_asset_name ]]"

    # URL encode artifact name for API calls
    API_ARTIFACT_NAME=$(python3 -c "from urllib.parse import quote; print(quote('$ARTIFACT_NAME', safe=''))")
    echo "API Encoded Artifact Name: $API_ARTIFACT_NAME"

    # Slugify the commit ref (replace special characters with hyphens)
    API_COMMIT_REF=$(devguard-scanner slug "$[[ inputs.commit_ref ]]")
    echo "Slugified Commit Ref: $API_COMMIT_REF"

    # Login to registry
    devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    echo 'Attestations: $[[ inputs.attestations ]]'

    ATT_JSON_CLEAN=$(echo '$[[ inputs.attestations ]]' \
    | sed 's/:\([a-z_]\+\)=>/"\1":/g' \
    | sed 's/=>/:/g' \
    | sed "s/'/\"/g")

    ATTESTATIONS_JSON=$(echo "$ATT_JSON_CLEAN" | jq . )

    # Process each attestation
    echo "$ATTESTATIONS_JSON" | jq -c '.[]' | while read -r attestation; do
      SOURCE=$(echo "$attestation" | jq -r '.source')
      PREDICATE_TYPE=$(echo "$attestation" | jq -r '.predicate_type')

      echo ""
      echo "========================================"
      echo "Processing attestation with predicate: $PREDICATE_TYPE"
      SOURCE=$(echo "$SOURCE" | envsubst)

      # Check if source is a URL (starts with http:// or https://)
      if [[ "$SOURCE" =~ ^https?:// ]]; then
        # Replace ARTIFACT_NAME placeholder with URL-encoded artifact name
        URL="${SOURCE//ARTIFACT_NAME/$API_ARTIFACT_NAME}"

        # Replace COMMIT_REF placeholder with URL-encoded commit ref
        URL="${URL//COMMIT_REF/$API_COMMIT_REF}"

        # Also handle any environment variable substitution
        URL=$(echo "$URL" | envsubst)

        # Extract filename from URL or use a default
        FILENAME=$(basename "$URL" | cut -d'?' -f1)
        if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ]; then
          FILENAME="downloaded-$(echo "$PREDICATE_TYPE" | md5sum | cut -d' ' -f1).json"
        fi

        echo "Downloading from URL: $URL"
        echo "Saving as: $FILENAME"

        devguard-scanner curl "$URL" --token="$[[ inputs.devguard_token ]]" > "/tmp/$FILENAME"
        FILE_PATH="/tmp/$FILENAME"
      else
        # It's a file path
        FILE_PATH="$SOURCE"
        echo "Using local file: $FILE_PATH"
      fi

      # Create attestation
      if [ -f "$FILE_PATH" ]; then
        echo "Creating attestation for $FILE_PATH"
        devguard-scanner attest "$FILE_PATH" \
          --predicateType="$PREDICATE_TYPE" \
          $IMAGE_TAG \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --artifactName="$ARTIFACT_NAME"
        echo "✓ Attestation created successfully"
      else
        echo "✗ Warning: File $FILE_PATH not found, skipping attestation"
      fi
      echo "========================================"
    done

    echo ""
    echo "All attestations completed"
devguard:provenance$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.build_job_name ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  id_tokens:
    DEVGUARD_ID_TOKEN:
      aud: $[[ inputs.devguard_api_url ]]
  variables:
    GIT_STRATEGY: none
    DEVGUARD_API_URL: $[[ inputs.devguard_api_url ]]
    REGISTRY: $[[ inputs.registry ]]
    REGISTRY_USER: $[[ inputs.registry_user ]]
    REGISTRY_PASSWORD: $[[ inputs.registry_password ]]
    IMAGE_TARS: image.tar
    IMAGE_TAG: $IMAGE_TAG
    MANIFEST_TAGS: $[[ inputs.manifest_tags ]]
    PROVENANCE_INPUTS: $[[ inputs.provenance_inputs ]]
  script:
    - |-
      set -eu

      # like the push job: drop a digest suffix and the tag, and lowercase the repository
      IMAGE_NAME="${IMAGE_TAG%@*}"
      IMAGE_NAME=$(echo "${IMAGE_NAME%:*}" | tr '[:upper:]' '[:lower:]')

      crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

      # images are matched by their config digest. The tarballs hold uncompressed layers which get compressed on push, and
      # different crane versions compress differently - so the manifest digest of a tarball is not necessarily the pushed one.
      # The config lists the uncompressed layer digests, which identifies the image independent of the compression.
      tarball_config_digest() {
        CONFIG=$(tar -xOf "$1" manifest.json | jq -r '.[0].Config')
        echo "sha256:$(tar -xOf "$1" "$CONFIG" | sha256sum | cut -d' ' -f1)"
      }
      config_digest() {
        crane manifest "$1" | jq -r '.config.digest'
      }
      sorted() {
        printf '%s\n' "$@" | sort | tr '\n' ' '
      }
      SUBJECT_DIGESTS=""
      add_subject() {
        case " $SUBJECT_DIGESTS " in
          *" $1 "*) ;;
          *) SUBJECT_DIGESTS="$SUBJECT_DIGESTS $1" ;;
        esac
      }

      # computed from the tarballs - nothing the build job wrote about its images is trusted
      BUILT_CONFIGS=""
      for TAR in $IMAGE_TARS; do
        if [ -f "$TAR" ]; then
          BUILT_CONFIGS="$BUILT_CONFIGS $(tarball_config_digest "$TAR")"
        else
          # builds which push directly to the registry publish no tarball - the build job decided what was pushed
          echo "WARNING: $TAR not found, attesting the image the build pushed to $IMAGE_TAG instead" >&2
          BUILT_CONFIGS="$BUILT_CONFIGS $(config_digest "$IMAGE_TAG")"
        fi
      done
      EXPECTED_CONFIGS=$(sorted $BUILT_CONFIGS)

      if [ -z "$(echo $MANIFEST_TAGS)" ]; then
        # single-arch: the tag has to point to the built image
        PUSHED_CONFIGS=$(sorted "$(config_digest "$IMAGE_TAG")")
        if [ "$PUSHED_CONFIGS" != "$EXPECTED_CONFIGS" ]; then
          echo "$IMAGE_TAG has the config $PUSHED_CONFIGS but the build produced $EXPECTED_CONFIGS" >&2
          exit 1
        fi
        add_subject "$(crane digest "$IMAGE_TAG")"
      fi

      # a multi-arch manifest is only attested if it references exactly the built images
      for TAG in $MANIFEST_TAGS; do
        PLATFORM_DIGESTS=$(crane manifest "$TAG" | jq -r '.manifests[].digest')
        LISTED_CONFIGS=""
        for DIGEST in $PLATFORM_DIGESTS; do
          LISTED_CONFIGS="$LISTED_CONFIGS $(config_digest "$IMAGE_NAME@$DIGEST")"
        done
        LISTED_CONFIGS=$(sorted $LISTED_CONFIGS)
        if [ "$LISTED_CONFIGS" != "$EXPECTED_CONFIGS" ]; then
          echo "manifest $TAG references images with the configs $LISTED_CONFIGS but the build produced $EXPECTED_CONFIGS" >&2
          exit 1
        fi
        for DIGEST in $PLATFORM_DIGESTS; do
          add_subject "$DIGEST"
        done
        add_subject "$(crane digest "$TAG")"
      done

      SUBJECT_IMAGES=""
      for DIGEST in $SUBJECT_DIGESTS; do
        SUBJECT_IMAGES="$SUBJECT_IMAGES,$IMAGE_NAME@$DIGEST"
      done
      set -- --image "${SUBJECT_IMAGES#,}"
      OLD_IFS="$IFS"
      IFS='
      '
      for INPUT in $PROVENANCE_INPUTS; do
        set -- "$@" --input "$INPUT"
      done
      IFS="$OLD_IFS"

      devguard-scanner provenance generate "$@" --output provenance.json
      devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json

      for DIGEST in $SUBJECT_DIGESTS; do
        echo "Attaching build provenance to $IMAGE_NAME@$DIGEST"
        devguard-scanner attest provenance.dsse.json "$IMAGE_NAME@$DIGEST" --predicateType=https://slsa.dev/provenance/v1 -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --offline
      done
