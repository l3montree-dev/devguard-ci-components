          --ignoreUpstreamAttestations=$[[ inputs.ignore_upstream_attestations ]] \
          -- $[[ inputs.extra_args ]]
      else
        echo "Scanning local tar file: image.tar"
        devguard-scanner container-scanning \
          --origin="$[[ inputs.devguard_origin ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --path="image.tar" \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --artifactName="$ARTIFACT_NAME" \
          --webUI="$[[ inputs.devguard_web_ui ]]" \
          --failOnRisk="$[[ inputs.fail_on_risk ]]" \
          --failOnCVSS="$[[ inputs.fail_on_cvss ]]" \
          -- $[[ inputs.extra_args ]]
      fi
devguard:push_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: registry.gitlab.com/l3montree/devguard/osscontainertools-kaniko-crane:kaniko-v1.28.3-devguard-scanner-v1.12.4@sha256:07b0db85f1fe98a8ce05cc1855649d9e758cea3ebb40e98b6282148b48c1a350
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $[[ inputs.small_artifact_registry ]] == "true"
      when: never
    - when: on_success
  script: |
    /crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    # Strip any "@sha256:..." digest suffix: the build job exports IMAGE_TAG as
    # "repo:tag@digest", and "crane push" against a tag+digest reference pushes by
    # digest only, never creating the tag that downstream jobs (manifest/sign/attest) need.
    IMAGE_REF="$IMAGE_TAG"
    IMAGE_REF="${IMAGE_REF%@*}"
    IMAGE_REF=$(echo "${IMAGE_REF}" | tr '[:upper:]' '[:lower:]')

    echo "Image: image.tar"
    echo "Image Tag: ${IMAGE_REF}"

    /crane push image.tar "${IMAGE_REF}"
devguard:sign_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:push_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  script:
    - devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - devguard-scanner sign --token="$[[ inputs.devguard_token ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --assetName="$[[ inputs.devguard_asset_name ]]" "$IMAGE_TAG"
devguard:create_root_tag$[[ inputs.job_suffix ]]:
  stage: attestation
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    entrypoint:
      - ""
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:push_oci_image$[[ inputs.job_suffix ]]
  script:
    - |-
      if [ "$[[ inputs.create_root_manifest ]]" != "true" ]; then
        echo "create_root_manifest is not true; skipping floating root tag"
        exit 0
      fi

      crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

      IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
      ROOT_TAG=$(echo "$IMAGE_TAG" | sed "s/-${CI_COMMIT_REF_NAME}//")

      if [ "$ROOT_TAG" = "$IMAGE_TAG" ]; then
        echo "No ref suffix found in $IMAGE_TAG; skipping floating root tag"
      else
        ROOT_TAG_ONLY="${ROOT_TAG##*:}"
        echo "Creating floating root tag: $ROOT_TAG_ONLY -> $IMAGE_TAG"
        crane tag "$IMAGE_TAG" "$ROOT_TAG_ONLY"

        echo "Signing floating root tag: $ROOT_TAG"
        /devguard-scanner sign --token="$[[ inputs.devguard_token ]]" "$ROOT_TAG" --offline

        echo "Attesting floating root tag: $ROOT_TAG"
        SLUG=$(/devguard-scanner slug "$[[ inputs.commit_ref ]]")

        /devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$ARTIFACT_NAME/sbom.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/sbom.json
        /devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$ARTIFACT_NAME/vex.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/vex.json
        /devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/sarif.json" --token="$[[ inputs.devguard_token ]]" > /tmp/sarif.json

        ATTESTATIONS="/tmp/sbom.json|https://cyclonedx.org/bom
      /tmp/vex.json|https://cyclonedx.org/vex
      /tmp/sarif.json|https://www.schemastore.org/schemas/json/sarif-2.1.0.json"

        echo "$ATTESTATIONS" | while IFS='|' read -r FILE PREDICATE_TYPE; do
          [ -z "$FILE" ] && continue
          echo "Attesting $FILE ($PREDICATE_TYPE) -> $ROOT_TAG"
          /devguard-scanner attest "$FILE" --predicateType="$PREDICATE_TYPE" "$ROOT_TAG" --token="$[[ inputs.devguard_token ]]" --offline
        done
      fi
devguard:attest$[[ inputs.job_suffix ]]:
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:provenance$[[ inputs.job_suffix ]]
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - devguard:container_scanning$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:provenance$[[ inputs.job_suffix ]]
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  script: |
    echo "Attesting artifacts for $IMAGE_TAG"
    echo "Artifact Name: $ARTIFACT_NAME"
    echo "Asset Name: $[[ inputs.devguard_asset_name ]]"

    # URL encode artifact name for API calls
    API_ARTIFACT_NAME=$(python3 -c "from urllib.parse import quote; print(quote('$ARTIFACT_NAME', safe=''))")
    echo "API Encoded Artifact Name: $API_ARTIFACT_NAME"

    # Slugify the commit ref (replace special characters with hyphens)
    API_COMMIT_REF=$(devguard-scanner slug "$[[ inputs.commit_ref ]]")
    echo "Slugified Commit Ref: $API_COMMIT_REF"

    # Login to registry
    devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    echo 'Attestations: $[[ inputs.attestations ]]'

    ATT_JSON_CLEAN=$(echo '$[[ inputs.attestations ]]' \
    | sed 's/:\([a-z_]\+\)=>/"\1":/g' \
    | sed 's/=>/:/g' \
    | sed "s/'/\"/g")

    ATTESTATIONS_JSON=$(echo "$ATT_JSON_CLEAN" | jq . )

    # Process each attestation
    echo "$ATTESTATIONS_JSON" | jq -c '.[]' | while read -r attestation; do
      SOURCE=$(echo "$attestation" | jq -r '.source')
      PREDICATE_TYPE=$(echo "$attestation" | jq -r '.predicate_type')

      echo ""
      echo "========================================"
      echo "Processing attestation with predicate: $PREDICATE_TYPE"
      SOURCE=$(echo "$SOURCE" | envsubst)

      # Check if source is a URL (starts with http:// or https://)
      if [[ "$SOURCE" =~ ^https?:// ]]; then
        # Replace ARTIFACT_NAME placeholder with URL-encoded artifact name
        URL="${SOURCE//ARTIFACT_NAME/$API_ARTIFACT_NAME}"

        # Replace COMMIT_REF placeholder with URL-encoded commit ref
        URL="${URL//COMMIT_REF/$API_COMMIT_REF}"

        # Also handle any environment variable substitution
        URL=$(echo "$URL" | envsubst)

        # Extract filename from URL or use a default
        FILENAME=$(basename "$URL" | cut -d'?' -f1)
        if [ -z "$FILENAME" ] || [ "$FILENAME" = "/" ]; then
          FILENAME="downloaded-$(echo "$PREDICATE_TYPE" | md5sum | cut -d' ' -f1).json"
        fi

        echo "Downloading from URL: $URL"
        echo "Saving as: $FILENAME"

        devguard-scanner curl "$URL" --token="$[[ inputs.devguard_token ]]" > "/tmp/$FILENAME"
        FILE_PATH="/tmp/$FILENAME"
      else
        # It's a file path
        FILE_PATH="$SOURCE"
        echo "Using local file: $FILE_PATH"
      fi

      # Create attestation
      if [ -f "$FILE_PATH" ]; then
        echo "Creating attestation for $FILE_PATH"
        devguard-scanner attest "$FILE_PATH" \
          --predicateType="$PREDICATE_TYPE" \
          $IMAGE_TAG \
          --defaultRef="$[[ inputs.default_ref ]]" \
          --ref="$[[ inputs.commit_ref ]]" \
          --isTag="$[[ inputs.is_tag ]]" \
          --token="$[[ inputs.devguard_token ]]" \
          --apiUrl="$[[ inputs.devguard_api_url ]]" \
          --assetName="$[[ inputs.devguard_asset_name ]]" \
          --artifactName="$ARTIFACT_NAME"
        echo "✓ Attestation created successfully"
      else
        echo "✗ Warning: File $FILE_PATH not found, skipping attestation"
      fi
      echo "========================================"
    done

    # the build provenance signed by the provenance job - attached as-is to the image its signed subject names
    if [ -f "provenance.dsse.json" ]; then
      PROVENANCE_SUBJECT=$(jq -r '.payload' provenance.dsse.json | base64 -d | jq -r '.subject[0] | .name + "@sha256:" + .digest.sha256')
      echo "Attaching build provenance to $PROVENANCE_SUBJECT"
      devguard-scanner attest provenance.dsse.json "$PROVENANCE_SUBJECT" \
        --predicateType="https://slsa.dev/provenance/v1" \
        --defaultRef="$[[ inputs.default_ref ]]" \
        --ref="$[[ inputs.commit_ref ]]" \
        --isTag="$[[ inputs.is_tag ]]" \
        --token="$[[ inputs.devguard_token ]]" \
        --apiUrl="$[[ inputs.devguard_api_url ]]" \
        --assetName="$[[ inputs.devguard_asset_name ]]" \
        --artifactName="$ARTIFACT_NAME"
    fi

    echo ""
    echo "All attestations completed"
devguard:provenance$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
    - job: devguard:push_oci_image$[[ inputs.job_suffix ]]
      optional: true
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  id_tokens:
    DEVGUARD_ID_TOKEN:
      aud: $[[ inputs.devguard_api_url ]]
  variables:
    GIT_STRATEGY: none
    DEVGUARD_API_URL: $[[ inputs.devguard_api_url ]]
    REGISTRY: $[[ inputs.registry ]]
    REGISTRY_USER: $[[ inputs.registry_user ]]
    REGISTRY_PASSWORD: $[[ inputs.registry_password ]]
    IMAGE_TAR: image.tar
    IMAGE_TAG: $IMAGE_TAG
    PROVENANCE_INPUTS: $[[ inputs.provenance_inputs ]]
  script:
    - |-
      set -eu

      # like the push job: lowercase the reference, the subject is named after the repository
      IMAGE_REF=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
      IMAGE_NAME="${IMAGE_REF%@*}"
      IMAGE_NAME="${IMAGE_NAME%:*}"

      crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

      # resolved once - everything below refers to the digest, so the tag moving in between does not matter
      DIGEST=$(crane digest "$IMAGE_REF")

      if [ -f "$IMAGE_TAR" ]; then
        # the pushed image is matched by its config digest. The tarball holds uncompressed layers which get compressed on
        # push, and different crane versions compress differently - so the manifest digest of the tarball is not necessarily
        # the pushed one. The config lists the uncompressed layer digests, which identifies the image independent of that.
        CONFIG=$(tar -xOf "$IMAGE_TAR" manifest.json | jq -r '.[0].Config')
        BUILT_CONFIG="sha256:$(tar -xOf "$IMAGE_TAR" "$CONFIG" | sha256sum | cut -d' ' -f1)"
        PUSHED_CONFIG=$(crane manifest "$IMAGE_NAME@$DIGEST" | jq -r '.config.digest')
        if [ "$PUSHED_CONFIG" != "$BUILT_CONFIG" ]; then
          echo "$IMAGE_REF has the config $PUSHED_CONFIG but the build produced $BUILT_CONFIG" >&2
          exit 1
        fi
      else
        # builds which push directly to the registry publish no tarball - the build job decided what was pushed
        echo "WARNING: $IMAGE_TAR not found, recording the image the build pushed to $IMAGE_REF instead" >&2
      fi

      set -- --image "$IMAGE_NAME@$DIGEST"
      OLD_IFS="$IFS"
      IFS='
      '
      for INPUT in $PROVENANCE_INPUTS; do
        set -- "$@" --input "$INPUT"
      done
      IFS="$OLD_IFS"

      devguard-scanner provenance generate "$@" --output provenance.json
      devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json
  artifacts:
    paths:
      - provenance.dsse.json
    expire_in: 1 week
devguard:sbom_upload$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:discover_baseimage_attestations$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:discover_baseimage_attestations$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script:
    - echo "Running DevGuard SBOM Upload..."
    - if [ -f "$[[ inputs.output ]]/attestation-bom.json" ]; then devguard-scanner sbom $[[ inputs.output ]]/attestation-bom.json --origin="BASE_IMAGE_SBOM" --assetName="$[[ inputs.devguard_asset_name ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --token="$[[ inputs.devguard_token ]]" --defaultRef="$[[ inputs.default_ref ]]" --ref="$[[ inputs.commit_ref ]]" --isTag="$[[ inputs.is_tag ]]" --artifactName="$[[ inputs.devguard_artifact_name ]]" --webUI=$[[ inputs.devguard_web_ui ]] --failOnRisk=$[[ inputs.fail_on_risk ]] --failOnCVSS=$[[ inputs.fail_on_cvss ]] --ignoreExternalReferences=$[[ inputs.ignore_external_references ]]; else echo "No SBOM file found at $[[ inputs.output ]]/attestation-bom.json, skipping upload"; fi
devguard:vex_upload$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: attestation
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:discover_baseimage_attestations$[[ inputs.job_suffix ]]
    - devguard:sbom_upload$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:discover_baseimage_attestations$[[ inputs.job_suffix ]]
    - devguard:sbom_upload$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: none
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script:
    - echo "Running DevGuard VeX Upload..."
    - if [ -f "$[[ inputs.output ]]/attestation-vex.json" ]; then devguard-scanner vex $[[ inputs.output ]]/attestation-vex.json --origin="BASE_IMAGE_VEX" --assetName="$[[ inputs.devguard_asset_name ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --token="$[[ inputs.devguard_token ]]" --defaultRef="$[[ inputs.default_ref ]]" --ref="$[[ inputs.commit_ref ]]" --isTag="$[[ inputs.is_tag ]]" --artifactName="$[[ inputs.devguard_artifact_name ]]" --ignoreExternalReferences=$[[ inputs.ignore_external_references ]]; else echo "No VeX file found at $[[ inputs.output ]]/attestation-vex.json, skipping upload"; fi
