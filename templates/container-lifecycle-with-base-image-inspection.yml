include: []
devguard:discover_baseimage_attestations$[[ inputs.job_suffix ]]:
  stage: oci-image
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  needs: $[[ inputs.needs ]]
  allow_failure: true
  dependencies: $[[ inputs.dependencies ]]
  script:
    - |-
      devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
      devguard-scanner discover-baseimage-attestations --output "$[[ inputs.output ]]" --predicateType "$[[ inputs.predicate_type ]]" "$[[ inputs.path ]]" || echo "No base image attestations found, continuing"
  artifacts:
    paths:
      - $[[ inputs.output ]]/attestation-*.json
devguard:generate_tag$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  variables:
    GIT_STRATEGY: fetch
    IMAGE_SUFFIX: $[[ inputs.image_suffix ]]
    DEVGUARD_ARTIFACT_NAME: $[[ inputs.devguard_artifact_name ]]
    ENV_FILENAME: generate_tag_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].env
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script: |
    echo "Running generate-tag job..."
    devguard-scanner generate-tag --imageSuffix "$IMAGE_SUFFIX" --imageVariant "$[[ inputs.image_variant ]]" --architecture "$[[ inputs.architecture ]]" --imagePath "$[[ inputs.image_path ]]" --ref "$CI_COMMIT_REF_NAME" --upstreamVersion "$[[ inputs.upstream_version ]]" >> ${ENV_FILENAME}
    echo "Tag generation completed. Generated tags:"
    cat ${ENV_FILENAME}
    echo "Filename: ${ENV_FILENAME}"
  artifacts:
    reports:
      dotenv: ${ENV_FILENAME}
    paths:
      - ${ENV_FILENAME}
$[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: fetch
  image:
    name: registry.gitlab.com/l3montree/devguard/osscontainertools-kaniko-crane:kaniko-v1.28.3-devguard-scanner-v1.12.4@sha256:07b0db85f1fe98a8ce05cc1855649d9e758cea3ebb40e98b6282148b48c1a350
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  before_script:
    - echo "Uses Kaniko to build Docker images securely without requiring privileged access (docker in docker needs privileged access).\n The artifacts are not pushed to the registry until they have undergone security scanning to ensure vulnerabilities are addressed before deployment - therefore they are stored as artifacts rather than pushed to the registry."
  script:
    - /crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - /kaniko/executor $[[ inputs.build_args ]] --ignore-path=/devguard-scanner --ignore-path=/crane --pre-cleanup --cleanup --preserve-context --destination $IMAGE_TAG $( [ "$[[ inputs.small_artifact_registry ]]" = "false" ] && echo "--no-push --tarPath image.tar" )
    - /crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - /crane digest $([[ "$[[ inputs.small_artifact_registry ]]" == "false" ]] && echo "--tarball=image.tar" || echo "$IMAGE_TAG" ) > image-digest.txt
    - echo "IMAGE_TAG=$IMAGE_TAG@$(cat image-digest.txt)" > variables.env
  artifacts:
    paths:
      - image.tar
      - image-digest.txt
      - variables.env
    reports:
      dotenv: variables.env
    when: on_success
devguard:container_scanning$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: oci-image
  allow_failure: $[[ inputs.allow_failure ]]
  needs:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
  dependencies:
    - devguard:generate_tag$[[ inputs.job_suffix ]]
    - $[[ inputs.job_prefix ]]devguard:build_oci_image$[[ inputs.job_suffix ]]
  variables:
    GIT_STRATEGY: fetch
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
  script:
