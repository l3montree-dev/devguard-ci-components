# This file is automatically generated. Do not edit directly.
spec:
  inputs:
    devguard_api_url:
      description: The url of the API to send the scan request to (default 'https://api.devguard.org')
      default: https://api.devguard.org
    stage:
      default: attestation
      description: The pipeline stage for the job
    job_suffix:
      type: string
      description: Suffix for the job name. You need this if you are using the component multiple times in one pipeline.
      default: ""
    runner_tags:
      default: []
      type: array
      description: The runner tags to use for the job
    pull_policy:
      description: The pull policy for the container image (can be [always, if-not-present, never])
      default: always
    allow_failure:
      description: Whether the job is allowed to fail without stopping the pipeline
      type: boolean
      default: false
    needs:
      description: List of jobs this attestation depends on
      type: array
      default: []
    dependencies:
      description: List of jobs to download artifacts from
      type: array
      default: []
    registry:
      description: Container registry URL
      default: $CI_REGISTRY
    registry_user:
      description: Container registry username
      default: $CI_REGISTRY_USER
    registry_password:
      description: Container registry password
      default: $CI_REGISTRY_PASSWORD
    image_tar:
      description: The image tarball the build produced
      default: image.tar
    image_tag:
      default: $IMAGE_TAG
      description: The tag the image got pushed to
    provenance_inputs:
      description: Newline separated key=value pairs the build was configured with. Recorded in the provenance.
      default: ""
---

include: []
devguard:provenance$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: $[[ inputs.stage ]]
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:v1.17.2
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  id_tokens:
    DEVGUARD_ID_TOKEN:
      aud: $[[ inputs.devguard_api_url ]]
  variables:
    GIT_STRATEGY: none
  script:
    - |-
      set -eu
      DEVGUARD_API_URL="$[[ inputs.devguard_api_url ]]"
      REGISTRY="$[[ inputs.registry ]]"
      REGISTRY_USER="$[[ inputs.registry_user ]]"
      REGISTRY_PASSWORD="$[[ inputs.registry_password ]]"
      IMAGE_TAR="$[[ inputs.image_tar ]]"
      IMAGE_TAG="$[[ inputs.image_tag ]]"
      PROVENANCE_INPUTS="$[[ inputs.provenance_inputs ]]"
      set -eu

      # like the push job: lowercase the reference, the subject is named after the repository
      IMAGE_REF=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
      IMAGE_NAME="${IMAGE_REF%@*}"
      IMAGE_NAME="${IMAGE_NAME%:*}"

      crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

      # resolved once - everything below refers to the digest, so the tag moving in between does not matter
      DIGEST=$(crane digest "$IMAGE_REF")

      if [ -f "$IMAGE_TAR" ]; then
        # the pushed image is matched by its config digest. The tarball holds uncompressed layers which get compressed on
        # push, and different crane versions compress differently - so the manifest digest of the tarball is not necessarily
        # the pushed one. The config lists the uncompressed layer digests, which identifies the image independent of that.
        CONFIG=$(tar -xOf "$IMAGE_TAR" manifest.json | jq -r '.[0].Config')
        BUILT_CONFIG="sha256:$(tar -xOf "$IMAGE_TAR" "$CONFIG" | sha256sum | cut -d' ' -f1)"
        PUSHED_CONFIG=$(crane manifest "$IMAGE_NAME@$DIGEST" | jq -r '.config.digest')
        if [ "$PUSHED_CONFIG" != "$BUILT_CONFIG" ]; then
          echo "$IMAGE_REF has the config $PUSHED_CONFIG but the build produced $BUILT_CONFIG" >&2
          exit 1
        fi
      else
        # builds which push directly to the registry publish no tarball - the build job decided what was pushed
        echo "WARNING: $IMAGE_TAR not found, recording the image the build pushed to $IMAGE_REF instead" >&2
      fi

      set -- --image "$IMAGE_NAME@$DIGEST"
      OLD_IFS="$IFS"
      IFS='
      '
      for INPUT in $PROVENANCE_INPUTS; do
        set -- "$@" --input "$INPUT"
      done
      IFS="$OLD_IFS"

      devguard-scanner provenance generate "$@" --output provenance.json
      devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json
  artifacts:
    paths:
      - provenance.dsse.json
    expire_in: 1 week
