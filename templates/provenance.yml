# This file is automatically generated. Do not edit directly.
spec:
  inputs:
    devguard_api_url:
      description: The url of the API to send the scan request to (default 'https://api.devguard.org')
      default: https://api.devguard.org
    stage:
      default: attestation
      description: The pipeline stage for the job
    job_suffix:
      type: string
      description: Suffix for the job name. You need this if you are using the component multiple times in one pipeline.
      default: ""
    runner_tags:
      default: []
      type: array
      description: The runner tags to use for the job
    pull_policy:
      description: The pull policy for the container image (can be [always, if-not-present, never])
      default: always
    allow_failure:
      description: Whether the job is allowed to fail without stopping the pipeline
      type: boolean
      default: false
    needs:
      description: List of jobs this attestation depends on
      type: array
      default: []
    dependencies:
      description: List of jobs to download artifacts from
      type: array
      default: []
    registry:
      description: Container registry URL
      default: $CI_REGISTRY
    registry_user:
      description: Container registry username
      default: $CI_REGISTRY_USER
    registry_password:
      description: Container registry password
      default: $CI_REGISTRY_PASSWORD
    image_tars:
      description: Space separated image tarballs the build produced (e.g. image-amd64.tar image-arm64.tar)
      default: image.tar
    image_tag:
      default: $IMAGE_TAG
      description: Any tag of the image repository - the provenance subjects are named after the repository
    manifest_tags:
      description: Space separated multi-arch manifest tags pointing to the built images. Leave empty for single-arch builds.
      default: ""
    provenance_inputs:
      description: Newline separated key=value pairs the build was configured with. Recorded in the provenance.
      default: ""
---

include: []
devguard:provenance$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: $[[ inputs.stage ]]
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  id_tokens:
    DEVGUARD_ID_TOKEN:
      aud: $[[ inputs.devguard_api_url ]]
  variables:
    GIT_STRATEGY: none
    DEVGUARD_API_URL: $[[ inputs.devguard_api_url ]]
    REGISTRY: $[[ inputs.registry ]]
    REGISTRY_USER: $[[ inputs.registry_user ]]
    REGISTRY_PASSWORD: $[[ inputs.registry_password ]]
    IMAGE_TARS: $[[ inputs.image_tars ]]
    IMAGE_TAG: $[[ inputs.image_tag ]]
    MANIFEST_TAGS: $[[ inputs.manifest_tags ]]
    PROVENANCE_INPUTS: $[[ inputs.provenance_inputs ]]
  script:
    - |-
      set -eu

      # like the push job: drop a digest suffix and the tag, and lowercase the repository
      IMAGE_NAME="${IMAGE_TAG%@*}"
      IMAGE_NAME=$(echo "${IMAGE_NAME%:*}" | tr '[:upper:]' '[:lower:]')

      crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

      # the digests are computed from the tarballs - nothing the build job wrote about its images is trusted
      BUILT_DIGESTS=""
      for TAR in $IMAGE_TARS; do
        if [ -f "$TAR" ]; then
          BUILT_DIGESTS="$BUILT_DIGESTS $(crane digest --tarball="$TAR")"
        else
          # builds which push directly to the registry publish no tarball - the build job decided what was pushed
          echo "WARNING: $TAR not found, attesting the image the build pushed to $IMAGE_TAG instead" >&2
          BUILT_DIGESTS="$BUILT_DIGESTS $(crane digest "$IMAGE_TAG")"
        fi
      done
      SUBJECT_DIGESTS="$BUILT_DIGESTS"

      # a multi-arch manifest is only attested if it references exactly the built images
      EXPECTED_DIGESTS=$(printf '%s\n' $BUILT_DIGESTS | sort | tr '\n' ' ')
      for TAG in $MANIFEST_TAGS; do
        LISTED_DIGESTS=$(crane manifest "$TAG" | jq -r '.manifests[].digest' | sort | tr '\n' ' ')
        if [ "$LISTED_DIGESTS" != "$EXPECTED_DIGESTS" ]; then
          echo "manifest $TAG references $LISTED_DIGESTS but the build produced $EXPECTED_DIGESTS" >&2
          exit 1
        fi
        INDEX_DIGEST=$(crane digest "$TAG")
        case " $SUBJECT_DIGESTS " in
          *" $INDEX_DIGEST "*) ;;
          *) SUBJECT_DIGESTS="$SUBJECT_DIGESTS $INDEX_DIGEST" ;;
        esac
      done

      SUBJECT_IMAGES=""
      for DIGEST in $SUBJECT_DIGESTS; do
        SUBJECT_IMAGES="$SUBJECT_IMAGES,$IMAGE_NAME@$DIGEST"
      done
      set -- --image "${SUBJECT_IMAGES#,}"
      OLD_IFS="$IFS"
      IFS='
      '
      for INPUT in $PROVENANCE_INPUTS; do
        set -- "$@" --input "$INPUT"
      done
      IFS="$OLD_IFS"

      devguard-scanner provenance generate "$@" --output provenance.json
      devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json

      for DIGEST in $SUBJECT_DIGESTS; do
        echo "Attaching build provenance to $IMAGE_NAME@$DIGEST"
        devguard-scanner attest provenance.dsse.json "$IMAGE_NAME@$DIGEST" --predicateType=https://slsa.dev/provenance/v1 -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --offline
      done
