# This file is automatically generated. Do not edit directly.
spec:
  inputs:
    runner_tags:
      default: []
      type: array
      description: The runner tags to use for the job
    stage:
      default: oci-image
      description: The pipeline stage for the job
    job_suffix:
      type: string
      description: Suffix for the job name. You need this if you are using the component multiple times in one pipeline.
      default: ""
    git_strategy:
      description: The Git strategy to use for the job
      default: none
    pull_policy:
      description: The pull policy for the container image (can be [always, if-not-present, never])
      default: always
    allow_failure:
      description: Whether the job is allowed to fail without stopping the pipeline
      type: boolean
      default: false
    needs:
      description: List of jobs this attestation depends on
      type: array
      default: []
    dependencies:
      description: List of jobs to download artifacts from
      type: array
      default: []
    registry:
      description: Container registry URL
      default: $CI_REGISTRY
    registry_user:
      description: Container registry username
      default: $CI_REGISTRY_USER
    registry_password:
      description: Container registry password
      default: $CI_REGISTRY_PASSWORD
    image:
      description: The image file to build (e.g. image.tar)
      default: image.tar
    image_tag:
      default: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      description: The tag to use for the built image. Leave empty to use the generated tag from the 'generate-tag' component.
    architecture:
      default: amd64
      description: Target architecture (e.g., amd64 or arm64)
    upstream_version:
      default: "0"
      description: Upstream version to use for tag generation. If not provided, the job will ignore this parameter.
    disable_job:
      default: "false"
      description: Whether to disable the job. This is useful when you want to conditionally disable this job in orchestration templates.
---

include: []
devguard:push_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: $[[ inputs.stage ]]
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  variables:
    GIT_STRATEGY: $[[ inputs.git_strategy ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $[[ inputs.disable_job ]] == "true"
      when: never
    - when: on_success
  script: |
    crane auth login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]

    # Strip any "@sha256:..." digest suffix: the build job exports IMAGE_TAG as
    # "repo:tag@digest", and "crane push" against a tag+digest reference pushes by
    # digest only, never creating the tag that downstream jobs (manifest/sign/attest) need.
    IMAGE_REF="$[[ inputs.image_tag ]]"
    BUILT_DIGEST=""
    case "$IMAGE_REF" in
      *@*) BUILT_DIGEST="${IMAGE_REF#*@}" ;;
    esac
    IMAGE_REF=$(echo "${IMAGE_REF%@*}" | tr '[:upper:]' '[:lower:]')

    echo "Image: $[[ inputs.image ]]"
    echo "Image Tag: ${IMAGE_REF}"

    # crane push prints the pushed reference with the digest it computed locally (repository@sha256:...) on stdout
    PUSHED=$(crane push $[[ inputs.image ]] "${IMAGE_REF}")
    echo "Pushed ${PUSHED}"

    # sign, attest and provenance name the digest the build computed (IMAGE_TAG=repository:tag@digest)
    if [ -n "$BUILT_DIGEST" ] && [ "${PUSHED#*@}" != "$BUILT_DIGEST" ]; then
      echo "ERROR: crane computed ${PUSHED#*@} for the pushed image, but the build computed $BUILT_DIGEST - signatures and attestations would name a different image."
      exit 1
    fi

    # the multi-arch manifest job references the pushed image by this digest
    echo "${PUSHED#*@}" > image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt
  artifacts:
    paths:
      - image_digest_$[[ inputs.upstream_version ]]_$[[ inputs.architecture ]].txt
