# This file is automatically generated. Do not edit directly.
spec:
  inputs:
    devguard_api_url:
      description: The url of the API to send the scan request to (default 'https://api.devguard.org')
      default: https://api.devguard.org
    devguard_asset_name:
      description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
      default: $DEVGUARD_ASSET_NAME
    registry:
      description: Container registry URL
      default: $CI_REGISTRY
    registry_user:
      description: Container registry username
      default: $CI_REGISTRY_USER
    image:
      description: The container image to sign (e.g., registry.example.com/project/image:tag)
      default: $CI_REGISTRY_IMAGE:latest
    pushed_digest_file:
      default: ""
      description: "File the push-oci-image job wrote the pushed digest to (image_digest_<upstream_version>_<architecture>.txt). If set and the image has no digest, the job names the pushed digest - and does nothing if the file is missing, as no image was pushed (e.g. merge request pipelines). Empty: the image as given."
    devguard_token:
      description: The DevGuard API token (use CI/CD variable, your private key)
      default: $DEVGUARD_TOKEN
    runner_tags:
      default: []
      type: array
      description: The runner tags to use for the job
    stage:
      default: attestation
      description: The pipeline stage for the job
    job_suffix:
      type: string
      description: Suffix for the job name. You need this if you are using the component multiple times in one pipeline.
      default: ""
    git_strategy:
      description: The Git strategy to use for the job
      default: fetch
    pull_policy:
      description: The pull policy for the container image (can be [always, if-not-present, never])
      default: always
    allow_failure:
      description: Whether the job is allowed to fail without stopping the pipeline
      type: boolean
      default: false
    needs:
      description: List of jobs this scan depends on
      type: array
      default: []
    dependencies:
      description: List of jobs to download artifacts from
      type: array
      default: []
    registry_password:
      description: Container registry password
      default: $CI_REGISTRY_PASSWORD
---

include: []
devguard:sign_oci_image$[[ inputs.job_suffix ]]:
  tags: $[[ inputs.runner_tags ]]
  stage: $[[ inputs.stage ]]
  allow_failure: $[[ inputs.allow_failure ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  variables:
    GIT_STRATEGY: $[[ inputs.git_strategy ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  script:
    - devguard-scanner login -u $[[ inputs.registry_user ]] -p $[[ inputs.registry_password ]] $[[ inputs.registry ]]
    - |-
      IMAGE_REF="$[[ inputs.image ]]"
      PUSHED_DIGEST_FILE="$[[ inputs.pushed_digest_file ]]"
      if [ -n "$PUSHED_DIGEST_FILE" ]; then
        case "$IMAGE_REF" in
          *@*) ;;
          *)
            if [ ! -f "$PUSHED_DIGEST_FILE" ]; then
              echo "$PUSHED_DIGEST_FILE not found - this pipeline pushed no image (e.g. a merge request pipeline), nothing to do"
              exit 0
            fi
            IMAGE_REF="$IMAGE_REF@$(cat "$PUSHED_DIGEST_FILE")"
            ;;
        esac
      fi
      echo "Image: $IMAGE_REF"
      devguard-scanner sign --token="$[[ inputs.devguard_token ]]" --apiUrl="$[[ inputs.devguard_api_url ]]" --assetName="$[[ inputs.devguard_asset_name ]]" "$IMAGE_REF"
