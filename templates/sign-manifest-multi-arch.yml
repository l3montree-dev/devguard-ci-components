# This file is automatically generated. Do not edit directly.
spec:
  inputs:
    stage:
      default: attestation
      description: The pipeline stage for the job
    needs:
      description: List of jobs this attestation depends on
      type: array
      default: []
    dependencies:
      description: List of jobs to download artifacts from
      type: array
      default: []
    job_suffix:
      type: string
      description: Suffix for the job name. You need this if you are using the component multiple times in one pipeline.
      default: ""
    pull_policy:
      description: The pull policy for the container image (can be [always, if-not-present, never])
      default: always
    devguard_token:
      description: The DevGuard API token (use CI/CD variable, your private key)
      default: $DEVGUARD_TOKEN
    devguard_api_url:
      description: The url of the API to send the scan request to (default 'https://api.devguard.org')
      default: https://api.devguard.org
    devguard_asset_name:
      description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
      default: $DEVGUARD_ASSET_NAME
    commit_ref:
      description: Current commit reference
      default: $CI_COMMIT_REF_NAME
    image_tars:
      description: Space separated image tarballs the build produced, one per architecture - the build provenance of the manifest is only signed if it references exactly these images
      default: image-amd64.tar image-arm64.tar
---

include: []
devguard:sign_manifest_multi_arch$[[ inputs.job_suffix ]]:
  stage: $[[ inputs.stage ]]
  needs: $[[ inputs.needs ]]
  dependencies: $[[ inputs.dependencies ]]
  image:
    name: ghcr.io/l3montree-dev/devguard/scanner:main
    pull_policy: $[[ inputs.pull_policy ]]
    entrypoint:
      - ""
  id_tokens:
    DEVGUARD_ID_TOKEN:
      aud: $[[ inputs.devguard_api_url ]]
  script:
    - |-
      devguard-scanner login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

      MANIFEST_TAGS="$MANIFEST_IMAGE_TAG"
      if [ -n "$MANIFEST_WITHOUT_REF_TAG" ]; then
        MANIFEST_TAGS="$MANIFEST_TAGS $MANIFEST_WITHOUT_REF_TAG"
      fi

      SLUG=$(devguard-scanner slug "$[[ inputs.commit_ref ]]")

      AMD64_API_ARTIFACT_NAME=$(python3 -c "from urllib.parse import quote; print(quote('$AMD64_ARTIFACT_NAME', safe=''))")
      ARM64_API_ARTIFACT_NAME=$(python3 -c "from urllib.parse import quote; print(quote('$ARM64_ARTIFACT_NAME', safe=''))")

      devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$AMD64_API_ARTIFACT_NAME/sbom.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/amd64.sbom.json
      devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$AMD64_API_ARTIFACT_NAME/vex.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/amd64.vex.json
      devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$ARM64_API_ARTIFACT_NAME/sbom.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/arm64.sbom.json
      devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/artifacts/$ARM64_API_ARTIFACT_NAME/vex.json/" --token="$[[ inputs.devguard_token ]]" > /tmp/arm64.vex.json
      devguard-scanner curl "$[[ inputs.devguard_api_url ]]/api/v1/organizations/$[[ inputs.devguard_asset_name ]]/refs/$SLUG/sarif.json" --token="$[[ inputs.devguard_token ]]" > /tmp/sarif.json

      ATTESTATIONS="/tmp/amd64.sbom.json|https://cyclonedx.org/bom
      /tmp/amd64.vex.json|https://cyclonedx.org/vex
      /tmp/arm64.sbom.json|https://cyclonedx.org/bom
      /tmp/arm64.vex.json|https://cyclonedx.org/vex
      /tmp/sarif.json|https://www.schemastore.org/schemas/json/sarif-2.1.0.json"

      for TAG in $MANIFEST_TAGS; do
        echo "Signing manifest: $TAG"
        devguard-scanner sign --token="$[[ inputs.devguard_token ]]" "$TAG" --offline

        echo "$ATTESTATIONS" | while IFS='|' read -r FILE PREDICATE_TYPE; do
          [ -z "$FILE" ] && continue
          echo "Attesting $FILE ($PREDICATE_TYPE) -> $TAG"
          devguard-scanner attest "$FILE" --predicateType="$PREDICATE_TYPE" "$TAG" --token="$[[ inputs.devguard_token ]]" --offline
        done
      done
    - |-
      (
      DEVGUARD_API_URL="$[[ inputs.devguard_api_url ]]"
      REGISTRY="$CI_REGISTRY"
      REGISTRY_USER="$CI_REGISTRY_USER"
      REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
      IMAGE_TARS="$[[ inputs.image_tars ]]"
      set -eu

      crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

      # images are matched by their config digest - see the provenance job
      tarball_config_digest() {
        CONFIG=$(tar -xOf "$1" manifest.json | jq -r '.[0].Config')
        echo "sha256:$(tar -xOf "$1" "$CONFIG" | sha256sum | cut -d' ' -f1)"
      }
      sorted() {
        printf '%s\n' "$@" | sort | tr '\n' ' '
      }

      BUILT_CONFIGS=""
      for TAR in $IMAGE_TARS; do
        BUILT_CONFIGS="$BUILT_CONFIGS $(tarball_config_digest "$TAR")"
      done
      EXPECTED_CONFIGS=$(sorted $BUILT_CONFIGS)

      INDEX_REFS=""
      for TAG in $MANIFEST_TAGS; do
        IMAGE_REF=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="${IMAGE_REF%@*}"
        IMAGE_NAME="${IMAGE_NAME%:*}"
        # resolved once - everything below refers to the digest
        INDEX_REF="$IMAGE_NAME@$(crane digest "$IMAGE_REF")"

        # the index is only attested if it references exactly the built images
        LISTED_CONFIGS=""
        for DIGEST in $(crane manifest "$INDEX_REF" | jq -r '.manifests[].digest'); do
          LISTED_CONFIGS="$LISTED_CONFIGS $(crane manifest "$IMAGE_NAME@$DIGEST" | jq -r '.config.digest')"
        done
        LISTED_CONFIGS=$(sorted $LISTED_CONFIGS)
        if [ "$LISTED_CONFIGS" != "$EXPECTED_CONFIGS" ]; then
          echo "$TAG references images with the configs $LISTED_CONFIGS but the build produced $EXPECTED_CONFIGS" >&2
          exit 1
        fi

        # the root tag points to the same index - attest it once
        case " $INDEX_REFS " in
          *" $INDEX_REF "*) ;;
          *) INDEX_REFS="$INDEX_REFS $INDEX_REF" ;;
        esac
      done

      for INDEX_REF in $INDEX_REFS; do
        devguard-scanner provenance generate --image "$INDEX_REF" --output index-provenance.json
        devguard-scanner provenance sign index-provenance.json --apiUrl "$DEVGUARD_API_URL" --output index-provenance.dsse.json
        echo "Attaching build provenance to $INDEX_REF"
        devguard-scanner attest index-provenance.dsse.json "$INDEX_REF" --predicateType=https://slsa.dev/provenance/v1 -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --offline
      done
      )
