# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      devguard-api-url:
        description: The url of the API to send the scan request to (default 'https://api.devguard.org')
        type: string
        required: false
        default: https://api.devguard.org
      devguard-asset-name:
        description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
        type: string
        required: false
        default: $DEVGUARD_ASSET_NAME
      devguard-web-ui:
        description: The DevGuard Web-UI Instance URL
        type: string
        required: false
        default: https://app.devguard.org
      allow-failure:
        description: Whether the job is allowed to fail without stopping the pipeline
        type: boolean
        required: false
        default: false
      path:
        description: The path to the git repository to scan
        type: string
        required: false
        default: /github/workspace
      default-ref:
        description: Default branch reference
        type: string
        required: false
        default: ${{ github.event.repository.default_branch }}
      commit-ref:
        description: Current commit reference
        type: string
        required: false
        default: ${{ github.ref_name }}
      is-tag:
        description: Is the current commit a tag
        type: string
        required: false
        default: ${{ github.ref_type == 'tag' }}
    secrets:
      devguard-token:
        description: DevGuard API token
        required: true
      submodule-ssh-key:
        description: SSH private deploy key used to check out private git submodules. Leave unset if the repo has no private submodules.
        required: false
jobs:
  devguard_infrastructure_as_code:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: DevGuard Infrastructure as Code
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:v1.12.0
        continue-on-error: ${{ inputs.allow-failure }}
        with:
          args: devguard-scanner iac --assetName="${{ inputs.devguard-asset-name }}" --apiUrl="${{ inputs.devguard-api-url }}" --token="${{ secrets.devguard-token }}" --path="${{ inputs.path }}" --defaultRef="${{ inputs.default-ref }}" --ref="${{ inputs.commit-ref }}" --isTag="${{ inputs.is-tag }}" --webUI=${{ inputs.devguard-web-ui }}
    name: devguard:infrastructure-as-code
