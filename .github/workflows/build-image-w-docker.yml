# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      image:
        description: The image file to build (e.g. image.tar)
        type: string
        required: false
        default: image.tar
      image-suffix:
        description: Suffix for the image name (e.g. 'web'). Leave empty for no suffix.
        type: string
        required: false
        default: default
      image-tag:
        description: The tag to use for the built image
        type: string
        required: false
        default: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
      push-image:
        description: If your GitLab instance has small artifact size limits, set this to true to push the image to the registry instead of uploading artifacts.
        type: string
        required: false
        default: "false"
    secrets:
      build-args:
        description: Build arguments passed to docker buildx build.
        required: false
      registry-user:
        description: Registry username for pushing the image.
        required: false
      registry-password:
        description: Registry password for pushing the image.
        required: false
      submodule-ssh-key:
        description: SSH private deploy key used to check out private git submodules. Leave unset if the repo has no private submodules.
        required: false
jobs:
  devguard_build_oci_image_w_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c887d9748da14dcb42b11cf8bcc773b301ea55b5
      - name: Build Docker image
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |-
          BUILD_ARGS="${{ secrets.build-args }}"
          if [ -z "$BUILD_ARGS" ]; then
            BUILD_ARGS="--context=. --file=Dockerfile"
          fi
          docker buildx build $BUILD_ARGS --output type=docker,dest=./$IMAGE -t $IMAGE_TAG
          echo "$IMAGE_TAG" > image-tag.txt
      - name: Get image digest
        env:
          IMAGE: ${{ inputs.image }}
        run: |-
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ghcr.io/l3montree-dev/devguard/scanner:v1.17.2 \
            crane digest --tarball="$IMAGE" > image-digest.txt
      - name: Push image to registry
        if: inputs.push-image == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |-
          docker load -i $IMAGE
          docker push $IMAGE_TAG
      - name: Upload oci-image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: ${{ inputs.image }}
        if: inputs.push-image != 'true'
      - name: Upload image-digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: image-digest.txt
      - name: Upload image-tag artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: image-tag.txt
    name: devguard:build-oci-image-w-docker
