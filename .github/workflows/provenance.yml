# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      devguard-api-url:
        description: The url of the API to send the scan request to (default 'https://api.devguard.org')
        type: string
        required: false
        default: https://api.devguard.org
      registry:
        description: Container registry URL
        type: string
        required: false
        default: ghcr.io
      registry-user:
        description: Container registry username
        type: string
        required: false
        default: ${{ github.actor }}
      image-suffix:
        description: Suffix for the image name (e.g. 'web'). Leave empty for no suffix.
        type: string
        required: false
        default: default
      should-deploy:
        description: Should the provenance job run
        type: boolean
        required: false
        default: true
    secrets:
      registry-password:
        description: Registry password for reading the pushed image. Defaults to the github token.
        required: false
jobs:
  devguard_provenance:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    permissions:
      id-token: write
      packages: read
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Download image-tag artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download image-digest artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: .
      - name: Generate and sign build provenance
        env:
          DEVGUARD_API_URL: ${{ inputs.devguard-api-url }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          PROVENANCE_INPUTS: ""
        run: |-
          # the reference the sign job signs
          IMAGE_TAG="$(cat image-tag.txt)@$(cat image-digest.txt)"
          export IMAGE_TAG

          AUDIENCE=$(jq -rn --arg audience "$DEVGUARD_API_URL" '$audience | @uri')
          DEVGUARD_ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$DEVGUARD_ID_TOKEN"
          export DEVGUARD_ID_TOKEN

          cat > provenance.sh << 'PROVENANCE_SCRIPT'
          set -eu

          # like the push job: lowercase the reference, the subject is named after the repository
          IMAGE_REF=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${IMAGE_REF%@*}"
          IMAGE_NAME="${IMAGE_NAME%:*}"

          crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

          # like signing: a reference with a digest names that digest, a tag the image it points to
          case "$IMAGE_REF" in
            *@*)
              DIGEST="${IMAGE_REF#*@}"
              # the digest comes from the build - provenance is only signed for an image which got pushed
              if ! crane manifest "$IMAGE_NAME@$DIGEST" > /dev/null; then
                echo "$IMAGE_NAME@$DIGEST is not in the registry - the image which got pushed has another digest" >&2
                exit 1
              fi
              ;;
            *)
              DIGEST=$(crane digest "$IMAGE_REF")
              ;;
          esac

          set -- --image "$IMAGE_NAME@$DIGEST"
          OLD_IFS="$IFS"
          IFS='
          '
          for INPUT in $PROVENANCE_INPUTS; do
            set -- "$@" --input "$INPUT"
          done
          IFS="$OLD_IFS"

          devguard-scanner provenance generate "$@" --output provenance.json
          devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json
          PROVENANCE_SCRIPT

          # run as the runner user - the scanner image user can not write to the workspace
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e IMAGE_TAG -e PROVENANCE_INPUTS \
            -e DEVGUARD_ID_TOKEN -e DEVGUARD_API_URL -e REGISTRY -e REGISTRY_USER -e REGISTRY_PASSWORD \
            --entrypoint sh ghcr.io/l3montree-dev/devguard/scanner:main provenance.sh
      - name: Upload build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provenance${{ inputs.image-suffix }}
          path: provenance.dsse.json
    name: devguard:provenance
