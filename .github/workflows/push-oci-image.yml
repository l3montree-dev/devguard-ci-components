# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      image-suffix:
        description: Suffix for the image name (e.g. 'web'). Leave empty for no suffix.
        type: string
        required: false
        default: default
      should-deploy:
        description: Should the push job run
        type: boolean
        required: false
        default: true
    secrets:
      submodule-ssh-key:
        description: SSH private deploy key used to check out private git submodules. Leave unset if the repo has no private submodules.
        required: false
jobs:
  devguard_push_oci_image:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive
      - name: Download oci-image artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: .
      - name: Download image-tag artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download image-digest artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: .
      - name: Log in to ghcr.io
        run: |-
          mkdir -p ${HOME}/.docker
          sudo chown -R 53111:53111 ${HOME}/.docker || true
          sudo chmod 700 ${HOME}/.docker || true
          docker run --rm \
            --user 53111:53111 \
            -v "${HOME}/.docker:/tmp/.docker" \
            ghcr.io/l3montree-dev/devguard/scanner:main \
            crane auth login ghcr.io -u $GITHUB_ACTOR -p $GITHUB_TOKEN
      - name: Push OCI image
        run: |-
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -v "${HOME}/.docker:/tmp/.docker:ro" \
            ghcr.io/l3montree-dev/devguard/scanner:main \
            crane push image.tar "$(cat image-tag.txt | tr '[:upper:]' '[:lower:]')"
    name: devguard:push-oci-image
