on:
  workflow_call:
    inputs:
      image-name:
        description: Full OCI image name without tag (e.g. ghcr.io/org/repo/image)
        type: string
        required: false
      image-suffix:
        description: Suffix for the image name when building multiple images
        type: string
        required: false
        default: ""
      nix-target:
        description: Flake output attribute to build (e.g. devguardOCI). Must be a dockerTools.buildLayeredImage derivation.
        type: string
        required: false
      nix-cache-substituter:
        description: Nix binary cache substituter URL. Set to empty string to disable.
        type: string
        required: false
        default: ""
      nix-cache-public-key:
        description: Trusted public key for the Nix binary cache.
        type: string
        required: false
        default: ""
      nix-cache-s3-endpoint:
        description: S3 API endpoint for pushing to the cache (e.g. s3.garage.l3montree.cloud). Leave empty to skip pushing.
        type: string
        required: false
        default: ""
      nix-cache-s3-bucket:
        description: S3 bucket name for the cache.
        type: string
        required: false
        default: ""
      nix-cache-region:
        description: S3 region for the cache bucket.
        type: string
        required: false
        default: ""
      nix-impure:
        description: Whether to allow impure builds (e.g., reading environment variables during build).
        type: string
        required: false
        default: "false"
      nix-version:
        description: Pinned Nix version for deterministic builds (must match other CI systems)
        type: string
        required: false
        default: 2.34.4
      architecture:
        description: Target architecture (e.g., amd64 or arm64)
        type: string
        required: false
        default: ""
      runner:
        description: GitHub Actions runner label to use (e.g. ubuntu-latest, ubuntu-24.04-arm)
        type: string
        required: false
        default: ubuntu-latest
      is-tag:
        description: Is the current commit a tag
        type: string
        required: false
        default: ${{ github.ref_type == 'tag' }}
      upstream-version:
        description: Upstream version to use for tag generation. If not provided, the job will ignore this parameter.
        type: string
        required: false
        default: "0"
      devguard-api-url:
        description: The url of the API to send the scan request to (default 'https://api.devguard.org')
        type: string
        required: false
        default: https://api.devguard.org
      devguard-asset-name:
        description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
        type: string
        required: false
        default: $DEVGUARD_ASSET_NAME
      devguard-web-ui:
        description: The DevGuard Web-UI Instance URL
        type: string
        required: false
        default: https://app.devguard.org
      devguard-artifact-name:
        description: The name of the artifact (in purl format e.g., pkg:oci/k8s-tools)
        type: string
        required: false
        default: ""
      devguard-origin:
        description: "Origin of the resource/information (how it was generated). Examples: 'source-scanning', 'container-scanning', 'base-image'. (default 'DEFAULT')"
        type: string
        required: false
        default: DEFAULT
      allow-failure:
        description: Whether the job is allowed to fail without stopping the pipeline
        type: boolean
        required: false
        default: false
      image-tar-path:
        description: The path to the local image tar file to scan (e.g. image.tar). Used when image_tag is empty.
        type: string
        required: false
        default: image.tar
      default-ref:
        description: Default branch reference
        type: string
        required: false
        default: ${{ github.event.repository.default_branch }}
      commit-ref:
        description: Current commit reference
        type: string
        required: false
        default: ${{ github.ref_name }}
      fail-on-risk:
        description: "The risk level to fail the job on. Options are: none, low, medium, high, critical"
        type: string
        required: false
        default: critical
      fail-on-cvss:
        description: "The CVSS score to fail the job on. Options are: none, low, medium, high, critical"
        type: string
        required: false
        default: critical
      ignore-external-references:
        description: Whether to ignore external references in any discovered attestations. This is useful when you are using this component to scan your own built images which have a valid vex attestation.
        type: string
        required: false
        default: "false"
      ignore-upstream-attestations:
        description: Whether to ignore upstream attestations when scanning the image.
        type: string
        required: false
        default: "false"
      extra-args:
        description: Extra arguments passed straight through to the underlying scanner invocation (after a '--' separator).
        type: string
        required: false
        default: ""
      should-deploy:
        description: Should the provenance job run
        type: boolean
        required: false
        default: true
      registry:
        description: Container registry URL
        type: string
        required: false
        default: ghcr.io
      registry-user:
        description: Container registry username
        type: string
        required: false
