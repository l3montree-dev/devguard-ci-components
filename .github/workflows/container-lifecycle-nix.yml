        description: Registry password for pushing the provenance. Defaults to the github token.
        required: false
jobs:
  devguard_build_nix:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          install_url: ${{ format('https://releases.nixos.org/nix/nix-{0}/install', inputs.nix-version) }}
          extra_nix_config: |-
            experimental-features = nix-command flakes
            ${{ inputs.nix-cache-substituter != '' && format('substituters = https://cache.nixos.org {0}', inputs.nix-cache-substituter) || '' }}
            ${{ inputs.nix-cache-public-key != '' && format('trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= {0}', inputs.nix-cache-public-key) || '' }}
      - name: Install crane and devguard-scanner
        run: nix profile install nixpkgs#crane github:l3montree-dev/devguard#devguardScanner
      - name: Write Nix cache secret key
        if: inputs.nix-cache-s3-endpoint != ''
        run: echo "${{ secrets.nix-cache-secret-key }}" > /tmp/nix-cache-priv-key.pem
      - name: Build OCI image with Nix
        env:
          NIX_TARGET: ${{ inputs.nix-target }}
          NIX_IMPURE: ${{ inputs.nix-impure }}
        run: nix build .#$NIX_TARGET $([ "$NIX_IMPURE" = "true" ] && echo --impure)
      - name: Push build results to Nix cache
        if: inputs.nix-cache-s3-endpoint != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.nix-cache-aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.nix-cache-aws-secret-access-key }}
          NIX_CACHE_S3_BUCKET: ${{ inputs.nix-cache-s3-bucket }}
          NIX_CACHE_S3_ENDPOINT: ${{ inputs.nix-cache-s3-endpoint }}
          NIX_CACHE_REGION: ${{ inputs.nix-cache-region }}
        run: |-
          mkdir -p ~/.aws
          echo "[profile nix-cache]" >> ~/.aws/config
          echo "s3.addressing_style = path" >> ~/.aws/config
          nix copy $(nix-store -qR $(readlink result)) \
            --to "s3://$NIX_CACHE_S3_BUCKET?endpoint=$NIX_CACHE_S3_ENDPOINT&region=$NIX_CACHE_REGION&scheme=https&profile=nix-cache&secret-key=/tmp/nix-cache-priv-key.pem" || true
      - name: Prepare image.tar
        run: gunzip -c "$(readlink -f result)" > image.tar
      - name: Get image digest
        run: crane digest --tarball=image.tar > image-digest.txt
      - name: Upload oci-image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: image.tar
      - name: Set image tag
        id: set-image-tag
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          ARCHITECTURE: ${{ inputs.architecture }}
          IS_TAG: ${{ inputs.is-tag }}
          UPSTREAM_VERSION: ${{ inputs.upstream-version }}
        run: |-
          devguard-scanner generate-tag \
            --imagePath="$IMAGE_NAME" \
            --ref="$GITHUB_REF_NAME" \
            --isTag=$IS_TAG \
            --architecture="$ARCHITECTURE" \
            --upstreamVersion="$UPSTREAM_VERSION" \
            >> image-tag-env.txt
          IMAGE_TAG=$(grep '^IMAGE_TAG=' image-tag-env.txt | cut -d= -f2-)
          ARTIFACT_NAME=$(grep '^ARTIFACT_NAME=' image-tag-env.txt | cut -d= -f2-)
          ARTIFACT_URL_ENCODED=$(grep '^ARTIFACT_URL_ENCODED=' image-tag-env.txt | cut -d= -f2-)
          echo "$IMAGE_TAG" > image-tag.txt
          echo "$ARTIFACT_NAME" > artifact-purl.txt
          echo "$ARTIFACT_URL_ENCODED" > artifact-purl-safe.txt
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
      - name: Upload image-tag artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: image-tag.txt
      - name: Upload image-digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: image-digest.txt
      - name: Upload artifact-purl artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifact-purl${{ inputs.image-suffix }}
          path: artifact-purl.txt
      - name: Upload artifact-purl-safe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifact-purl-safe${{ inputs.image-suffix }}
          path: artifact-purl-safe.txt
    name: devguard:build-nix
  devguard_container_scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Download Docker image artifact (created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: .
        if: "true"
      - name: Download image-tag artifact (created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download artifact purl (created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl${{ inputs.image-suffix }}
        if: ${{ inputs.devguard-artifact-name == '' }}
      - name: Resolve artifact name
        env:
          DEVGUARD_ARTIFACT_NAME: ${{ inputs.devguard-artifact-name }}
        run: |-
          if [ -z "$DEVGUARD_ARTIFACT_NAME" ] && [ -f artifact-purl.txt ]; then
            echo "ARTIFACT_NAME=$(cat artifact-purl.txt)" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=$DEVGUARD_ARTIFACT_NAME" >> $GITHUB_ENV
          fi
      - name: Setup crane
        uses: imjasonh/setup-crane@cacf28038427f6fb033ef9022f6a2281f23cb3f2
      - name: Download OCI Image from registry
        run: crane pull $(cat image-tag.txt) image.tar
        if: "false"
      - name: DevGuard Container-Scanning
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        continue-on-error: ${{ inputs.allow-failure }}
        with:
          args: devguard-scanner container-scanning --origin="${{ inputs.devguard-origin }}" --assetName="${{ inputs.devguard-asset-name }}" --apiUrl="${{ inputs.devguard-api-url }}" --token="${{ secrets.devguard-token }}" --path="${{ inputs.image-tar-path }}" --defaultRef="${{ inputs.default-ref }}" --ref="${{ inputs.commit-ref }}" --isTag="${{ inputs.is-tag }}" --artifactName="${{ env.ARTIFACT_NAME }}" --webUI="${{ inputs.devguard-web-ui }}" --failOnRisk="${{ inputs.fail-on-risk }}" --failOnCVSS="${{ inputs.fail-on-cvss }}" --ignoreExternalReferences=${{ inputs.ignore-external-references }} --ignoreUpstreamAttestations=${{ inputs.ignore-upstream-attestations }} -- ${{ inputs.extra-args }}
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
    needs:
      - devguard_build_nix
    name: devguard:container-scanning
  devguard_deploy:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    steps:
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Download oci-image artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: .
        if: "true"
      - name: Download image-tag artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download image-digest artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: .
      - name: Setup crane
        uses: imjasonh/setup-crane@cacf28038427f6fb033ef9022f6a2281f23cb3f2
      - name: Push oci image to GitHub image Registry
        run: crane push image.tar "$(cat image-tag.txt)"
        if: "true"
    needs:
      - devguard_build_nix
      - devguard_container_scanning
    name: devguard:deploy
  devguard_sign:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Set up SSH for private git submodules
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.submodule-ssh-key }}
        run: |-
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SUBMODULE_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan gitlab.com github.com >> ~/.ssh/known_hosts
          fi
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Download image-tag artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download image-digest artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: .
      - name: Set Image to be signed
        run: echo "IMAGE_TAG_AND_DIGEST=$(cat image-tag.txt)@$(cat image-digest.txt)" >> $GITHUB_ENV
      - name: DevGuard Image-Signing
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: devguard-scanner sign -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" --token="${{ secrets.devguard-token }}" ${{ env.IMAGE_TAG_AND_DIGEST }} --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }}
    needs:
      - devguard_build_nix
      - devguard_container_scanning
      - devguard_deploy
    name: devguard:sign
  devguard_attest:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Download image-digest artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-digest${{ inputs.image-suffix }}
          path: .
        continue-on-error: true
      - name: Download image-tag artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: .
      - name: Download artifact purl (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl${{ inputs.image-suffix }}
        if: inputs.devguard-artifact-name == ''
      - name: Download safe-artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl-safe${{ inputs.image-suffix }}
        if: inputs.devguard-artifact-name == ''
      - name: set artifact-name variable if it is empty
        env:
          DEVGUARD_ARTIFACT_NAME: ${{ inputs.devguard-artifact-name }}
        run: |-
          if [ -z "$DEVGUARD_ARTIFACT_NAME" ] && [ -f artifact-purl.txt ]; then
            echo "ARTIFACT_NAME=$(cat artifact-purl.txt)" >> $GITHUB_ENV
            echo "Using artifact name from file: $ARTIFACT_NAME"
            # For API calls, use safe artifact name if it exists
            if [ -f artifact-purl-safe.txt ]; then
              echo "API_ARTIFACT_NAME=$(cat artifact-purl-safe.txt)" >> $GITHUB_ENV
            else
              echo "API_ARTIFACT_NAME=$(cat artifact-purl.txt)" >> $GITHUB_ENV
            fi
          else
            # make sure to url encode
            echo "ARTIFACT_NAME=$DEVGUARD_ARTIFACT_NAME" >> $GITHUB_ENV
            echo "API_ARTIFACT_NAME=$(echo -n "$DEVGUARD_ARTIFACT_NAME" | jq -s -R -r @uri)" >> $GITHUB_ENV
            echo "Using provided artifact name: $DEVGUARD_ARTIFACT_NAME"
            echo "Encoded: $API_ARTIFACT_NAME"
          fi
          echo "Resolved artifact name for attestation: $DEVGUARD_ARTIFACT_NAME"
      - name: Get and Attest SBOM
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              artifact_name="$ARTIFACT_NAME" &&
              echo 'Fetching SBOM for artifact:' '${{ env.API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.API_ARTIFACT_NAME }}/sbom.json/' --token='${{ secrets.devguard-token }}' > /tmp/sbom.json &&
              echo 'SBOM downloaded to /tmp/sbom.json' &&
              if [ -f image-digest.txt ]; then
                echo 'Attesting SBOM with image digest present' &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/sbom.json --predicateType='https://cyclonedx.org/bom' \"$(cat image-tag.txt)@$(cat image-digest.txt)\" --token='${{ secrets.devguard-token }}' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              else
                echo 'Attesting SBOM without image digest' &&
                devguard-scanner attest /tmp/sbom.json --predicateType='https://cyclonedx.org/bom' --token='${{ secrets.devguard-token }}' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              fi
            "
        env:
          API_ARTIFACT_NAME: ${{ env.API_ARTIFACT_NAME }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      - name: Get and Attest VeX
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              artifact_name="$ARTIFACT_NAME" &&
              echo 'Fetching VeX for artifact:' '${{ env.API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.API_ARTIFACT_NAME }}/vex.json/' --token='${{ secrets.devguard-token }}' > /tmp/vex.json &&
              echo 'VeX downloaded to /tmp/vex.json' &&
              if [ -f image-digest.txt ]; then
                echo 'Attesting VeX with image digest present' &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/vex.json \"$(cat image-tag.txt)@$(cat image-digest.txt)\" --token='${{ secrets.devguard-token }}' --predicateType='https://cyclonedx.org/vex' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              else
                echo 'Attesting VeX without image digest' &&
                devguard-scanner attest /tmp/vex.json --predicateType='https://cyclonedx.org/vex' --token='${{ secrets.devguard-token }}' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              fi
            "
        env:
          API_ARTIFACT_NAME: ${{ env.API_ARTIFACT_NAME }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      - name: Get and Attest SAST-Results
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              artifact_name="$ARTIFACT_NAME" &&
              echo 'Fetching SAST results for artifact:' '${{ env.ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/sarif.json' --token='${{ secrets.devguard-token }}' > /tmp/sarif.json &&
              echo 'SAST results downloaded to /tmp/sarif.json' &&
              if [ -f image-digest.txt ]; then
                echo 'Attesting SAST results with image digest present' &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/sarif.json \"$(cat image-tag.txt)@$(cat image-digest.txt)\" --predicateType='https://www.schemastore.org/schemas/json/sarif-2.1.0.json' --token='${{ secrets.devguard-token }}' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              else
                echo 'Attesting SAST results without image digest' &&
                devguard-scanner attest /tmp/sarif.json --predicateType='https://www.schemastore.org/schemas/json/sarif-2.1.0.json' --token='${{ secrets.devguard-token }}' --apiUrl=${{ inputs.devguard-api-url }} --assetName=${{ inputs.devguard-asset-name }} --ref=${{ inputs.commit-ref }} --isTag=${{ inputs.is-tag }} --artifactName="$artifact_name"
              fi
            "
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
    needs:
      - devguard_build_nix
      - devguard_container_scanning
      - devguard_deploy
    name: devguard:attest
  devguard_provenance:
    runs-on: ubuntu-latest
    if: inputs.should-deploy
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Download oci-image${{ inputs.image-suffix }}
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}
          path: build-0
        continue-on-error: true
      - name: Download image-tag${{ inputs.image-suffix }}
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}
          path: build-0
      - name: Generate, sign and attach build provenance
        env:
          DEVGUARD_API_URL: ${{ inputs.devguard-api-url }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          IMAGE_TARS: build-0/image.tar
          MANIFEST_TAGS: ${{ inputs.manifest-tags }}
          PROVENANCE_INPUTS: |-
            nix-target=${{ inputs.nix-target }}
            nix-impure=${{ inputs.nix-impure }}
        run: |-
          IMAGE_TAG=$(cat build-0/image-tag.txt)
          export IMAGE_TAG

          AUDIENCE=$(jq -rn --arg audience "$DEVGUARD_API_URL" '$audience | @uri')
          DEVGUARD_ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$DEVGUARD_ID_TOKEN"
          export DEVGUARD_ID_TOKEN

          cat > provenance.sh << 'PROVENANCE_SCRIPT'
          set -eu

          # like the push job: drop a digest suffix and the tag, and lowercase the repository
          IMAGE_NAME="${IMAGE_TAG%@*}"
          IMAGE_NAME=$(echo "${IMAGE_NAME%:*}" | tr '[:upper:]' '[:lower:]')

          crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

          # the digests are computed from the tarballs - nothing the build job wrote about its images is trusted
          BUILT_DIGESTS=""
          for TAR in $IMAGE_TARS; do
            if [ -f "$TAR" ]; then
              BUILT_DIGESTS="$BUILT_DIGESTS $(crane digest --tarball="$TAR")"
            else
              # builds which push directly to the registry publish no tarball - the build job decided what was pushed
              echo "WARNING: $TAR not found, attesting the image the build pushed to $IMAGE_TAG instead" >&2
              BUILT_DIGESTS="$BUILT_DIGESTS $(crane digest "$IMAGE_TAG")"
            fi
          done
          SUBJECT_DIGESTS="$BUILT_DIGESTS"

          # a multi-arch manifest is only attested if it references exactly the built images
          EXPECTED_DIGESTS=$(printf '%s\n' $BUILT_DIGESTS | sort | tr '\n' ' ')
          for TAG in $MANIFEST_TAGS; do
            LISTED_DIGESTS=$(crane manifest "$TAG" | jq -r '.manifests[].digest' | sort | tr '\n' ' ')
            if [ "$LISTED_DIGESTS" != "$EXPECTED_DIGESTS" ]; then
              echo "manifest $TAG references $LISTED_DIGESTS but the build produced $EXPECTED_DIGESTS" >&2
              exit 1
            fi
            INDEX_DIGEST=$(crane digest "$TAG")
            case " $SUBJECT_DIGESTS " in
              *" $INDEX_DIGEST "*) ;;
              *) SUBJECT_DIGESTS="$SUBJECT_DIGESTS $INDEX_DIGEST" ;;
            esac
          done

          SUBJECT_IMAGES=""
          for DIGEST in $SUBJECT_DIGESTS; do
            SUBJECT_IMAGES="$SUBJECT_IMAGES,$IMAGE_NAME@$DIGEST"
          done
          set -- --image "${SUBJECT_IMAGES#,}"
          OLD_IFS="$IFS"
          IFS='
          '
          for INPUT in $PROVENANCE_INPUTS; do
            set -- "$@" --input "$INPUT"
          done
          IFS="$OLD_IFS"

          devguard-scanner provenance generate "$@" --output provenance.json
          devguard-scanner provenance sign provenance.json --apiUrl "$DEVGUARD_API_URL" --output provenance.dsse.json

          for DIGEST in $SUBJECT_DIGESTS; do
            echo "Attaching build provenance to $IMAGE_NAME@$DIGEST"
            devguard-scanner attest provenance.dsse.json "$IMAGE_NAME@$DIGEST" --predicateType=https://slsa.dev/provenance/v1 -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --offline
          done
          PROVENANCE_SCRIPT

          docker run --rm -v "$PWD:/work" -w /work \
            -e IMAGE_TARS -e IMAGE_TAG -e MANIFEST_TAGS -e PROVENANCE_INPUTS \
            -e DEVGUARD_ID_TOKEN -e DEVGUARD_API_URL -e REGISTRY -e REGISTRY_USER -e REGISTRY_PASSWORD \
            --entrypoint sh ghcr.io/l3montree-dev/devguard/scanner:main provenance.sh
    needs:
      - devguard_build_nix
      - devguard_deploy
    name: devguard:provenance
