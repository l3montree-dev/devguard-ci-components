# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      upstream-version:
        description: Upstream version to use for tag generation. If not provided, the job will ignore this parameter.
        type: string
        required: false
        default: "0"
      create-root-manifest:
        description: Whether to also create a manifest without the branch ref in the tag.
        type: string
        required: false
        default: ${{ github.ref_type == 'tag' }}
      image-suffix:
        description: Suffix for the image name (e.g. 'web'). Leave empty for no suffix.
        type: string
        required: false
        default: default
      registry:
        description: Container registry URL
        type: string
        required: false
        default: ghcr.io
      registry-user:
        description: Container registry username
        type: string
        required: false
        default: ${{ github.actor }}
      devguard-api-url:
        description: The url of the API to send the scan request to (default 'https://api.devguard.org')
        type: string
        required: false
        default: https://api.devguard.org
      devguard-asset-name:
        description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
        type: string
        required: false
        default: $DEVGUARD_ASSET_NAME
      devguard-artifact-name:
        description: The name of the artifact (in purl format e.g., pkg:oci/k8s-tools)
        type: string
        required: false
        default: ""
      commit-ref:
        description: Current commit reference
        type: string
        required: false
        default: ${{ github.ref_name }}
      is-tag:
        description: Is the current commit a tag
        type: string
        required: false
        default: ${{ github.ref_type == 'tag' }}
    secrets:
      registry-password:
        description: Registry password for pulling the image.
        required: false
      devguard-token:
        description: DevGuard API token
        required: true
jobs:
  devguard_create_manifest_multi_arch:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Download amd64 image-tag
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}-amd64
          path: amd64
      - name: Download arm64 image-tag
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}-arm64
          path: arm64
      - name: Log in to registry
        uses: docker/login-action@3864d6aed8ff134b2ed894ce00c87695c709c870
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Create and push multi-arch manifest
        env:
          CREATE_ROOT_MANIFEST: ${{ inputs.create-root-manifest }}
        run: |-
          AMD64_TAG=$(cat amd64/image-tag.txt)
          ARM64_TAG=$(cat arm64/image-tag.txt)

          if [ -z "$AMD64_TAG" ] || [ -z "$ARM64_TAG" ]; then
            echo "ERROR: Could not read arch-specific IMAGE_TAG from image-tag artifacts"
            exit 1
          fi

          echo "amd64: $AMD64_TAG"
          echo "arm64: $ARM64_TAG"

          BASE_TAG="${AMD64_TAG%-amd64}"

          echo "Creating manifest: $BASE_TAG -> $AMD64_TAG + $ARM64_TAG"
          docker manifest create "$BASE_TAG" "$AMD64_TAG" "$ARM64_TAG"
          docker manifest push "$BASE_TAG"

          MANIFEST_TAGS="$BASE_TAG"

          if [ "$CREATE_ROOT_MANIFEST" = "true" ]; then
            ROOT_TAG=$(echo "$BASE_TAG" | sed "s/-${GITHUB_REF_NAME}//")
            if [ "$ROOT_TAG" != "$BASE_TAG" ]; then
              echo "Creating root manifest: $ROOT_TAG"
              docker manifest create "$ROOT_TAG" "$AMD64_TAG" "$ARM64_TAG"
              docker manifest push "$ROOT_TAG"
              MANIFEST_TAGS="$MANIFEST_TAGS $ROOT_TAG"
            fi
          fi

          echo "MANIFEST_TAGS=$MANIFEST_TAGS" >> $GITHUB_ENV
      - name: Sign multi-arch manifest(s)
        env:
          DEVGUARD_TOKEN: ${{ secrets.devguard-token }}
        run: |-
          for TAG in $MANIFEST_TAGS; do
            echo "Signing manifest: $TAG"
            docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner sign -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" --token="$DEVGUARD_TOKEN" "$TAG" --apiUrl="${{ inputs.devguard-api-url }}" --assetName="${{ inputs.devguard-asset-name }}"
          done
      - name: Download amd64 build provenance
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: build${{ inputs.image-suffix }}-amd64.provenance.json
        continue-on-error: true
      - name: Rename amd64 build provenance
        run: "[ -f build.provenance.json ] && mv build.provenance.json amd64.provenance.json || true"
      - name: Download arm64 build provenance
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: build${{ inputs.image-suffix }}-arm64.provenance.json
        continue-on-error: true
      - name: Rename arm64 build provenance
        run: "[ -f build.provenance.json ] && mv build.provenance.json arm64.provenance.json || true"
      - name: Download amd64 artifact purl
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl${{ inputs.image-suffix }}-amd64
          path: amd64
        if: inputs.devguard-artifact-name == ''
        continue-on-error: true
      - name: Download amd64 artifact purl (safe)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl-safe${{ inputs.image-suffix }}-amd64
          path: amd64
        if: inputs.devguard-artifact-name == ''
        continue-on-error: true
      - name: Attest multi-arch manifest(s)
        env:
          DEVGUARD_TOKEN: ${{ secrets.devguard-token }}
        run: |-
          ARTIFACT_NAME="${{ inputs.devguard-artifact-name }}"
          if [ -z "$ARTIFACT_NAME" ] && [ -f amd64/artifact-purl.txt ]; then
            ARTIFACT_NAME=$(cat amd64/artifact-purl.txt)
          fi
          if [ -f amd64/artifact-purl-safe.txt ]; then
            API_ARTIFACT_NAME=$(cat amd64/artifact-purl-safe.txt)
          else
            API_ARTIFACT_NAME=$(echo -n "$ARTIFACT_NAME" | jq -s -R -r @uri)
          fi
          echo "Attesting for artifact: $ARTIFACT_NAME"

          SLUG=$(docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner slug "${{ inputs.commit-ref }}")

          docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner curl "${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/$SLUG/artifacts/$API_ARTIFACT_NAME/sbom.json/" --token="$DEVGUARD_TOKEN" > /tmp/sbom.json
          docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner curl "${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/$SLUG/artifacts/$API_ARTIFACT_NAME/vex.json/" --token="$DEVGUARD_TOKEN" > /tmp/vex.json
          docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner curl "${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/$SLUG/sarif.json" --token="$DEVGUARD_TOKEN" > /tmp/sarif.json

          ATTESTATIONS=("/tmp/sbom.json:https://cyclonedx.org/bom" "/tmp/vex.json:https://cyclonedx.org/vex" "/tmp/sarif.json:https://www.schemastore.org/schemas/json/sarif-2.1.0.json")
          [ -f amd64.provenance.json ] && ATTESTATIONS+=("amd64.provenance.json:https://slsa.dev/provenance/v1")
          [ -f arm64.provenance.json ] && ATTESTATIONS+=("arm64.provenance.json:https://slsa.dev/provenance/v1")

          for TAG in $MANIFEST_TAGS; do
            for ENTRY in "${ATTESTATIONS[@]}"; do
              FILE="${ENTRY%%:*}"
              PREDICATE_TYPE="${ENTRY#*:}"
              echo "Attesting $FILE ($PREDICATE_TYPE) -> $TAG"
              docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" "$FILE" --predicateType="$PREDICATE_TYPE" "$TAG" --token="$DEVGUARD_TOKEN" --apiUrl="${{ inputs.devguard-api-url }}" --assetName="${{ inputs.devguard-asset-name }}" --ref="${{ inputs.commit-ref }}" --isTag="${{ inputs.is-tag }}" --artifactName="$ARTIFACT_NAME"
            done
          done
    name: devguard:create-manifest-multi-arch
