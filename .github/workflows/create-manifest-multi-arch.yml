# This file is automatically generated. Do not edit directly.
on:
  workflow_call:
    inputs:
      create-root-manifest:
        description: Whether to also create a manifest without the branch ref in the tag.
        type: string
        required: false
        default: ${{ github.ref_type == 'tag' }}
      image-suffix:
        description: Suffix for the image name (e.g. 'web'). Leave empty for no suffix.
        type: string
        required: false
        default: default
      registry:
        description: Container registry URL
        type: string
        required: false
        default: ghcr.io
      registry-user:
        description: Container registry username
        type: string
        required: false
        default: ${{ github.actor }}
      devguard-api-url:
        description: The url of the API to send the scan request to (default 'https://api.devguard.org')
        type: string
        required: false
        default: https://api.devguard.org
      devguard-asset-name:
        description: DevGuard asset name (e.g., @opencode/projects/oci/assets/k8s-tools)
        type: string
        required: false
        default: $DEVGUARD_ASSET_NAME
      commit-ref:
        description: Current commit reference
        type: string
        required: false
        default: ${{ github.ref_name }}
      devguard-artifact-name:
        description: The name of the artifact (in purl format e.g., pkg:oci/k8s-tools)
        type: string
        required: false
        default: ""
    secrets:
      registry-password:
        description: Registry password for pulling the image.
        required: false
      devguard-token:
        description: DevGuard API token
        required: true
jobs:
  devguard_create_manifest_multi_arch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Resolve registry password
        run: |-
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD=$SECRET_PASSWORD" >> $GITHUB_ENV
          else
            echo "REGISTRY_PASSWORD=$FALLBACK_TOKEN" >> $GITHUB_ENV
          fi
        env:
          SECRET_PASSWORD: ${{ secrets.registry-password }}
          FALLBACK_TOKEN: ${{ github.token }}
      - name: Download amd64 image-tag
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}-amd64
          path: amd64
      - name: Download arm64 image-tag
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: image-tag${{ inputs.image-suffix }}-arm64
          path: arm64
      - name: Log in to registry
        uses: docker/login-action@3864d6aed8ff134b2ed894ce00c87695c709c870
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-user }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Create and push multi-arch manifest
        env:
          CREATE_ROOT_MANIFEST: ${{ inputs.create-root-manifest }}
        run: |-
          AMD64_TAG=$(cat amd64/image-tag.txt)
          ARM64_TAG=$(cat arm64/image-tag.txt)

          if [ -z "$AMD64_TAG" ] || [ -z "$ARM64_TAG" ]; then
            echo "ERROR: Could not read arch-specific IMAGE_TAG from image-tag artifacts"
            exit 1
          fi

          echo "amd64: $AMD64_TAG"
          echo "arm64: $ARM64_TAG"

          BASE_TAG="${AMD64_TAG%-amd64}"

          echo "Creating manifest: $BASE_TAG -> $AMD64_TAG + $ARM64_TAG"
          docker manifest create "$BASE_TAG" "$AMD64_TAG" "$ARM64_TAG"
          docker manifest push "$BASE_TAG"

          MANIFEST_TAGS="$BASE_TAG"

          if [ "$CREATE_ROOT_MANIFEST" = "true" ]; then
            ROOT_TAG=$(echo "$BASE_TAG" | sed "s/-${GITHUB_REF_NAME}//")
            if [ "$ROOT_TAG" != "$BASE_TAG" ]; then
              echo "Creating root manifest: $ROOT_TAG"
              docker manifest create "$ROOT_TAG" "$AMD64_TAG" "$ARM64_TAG"
              docker manifest push "$ROOT_TAG"
              MANIFEST_TAGS="$MANIFEST_TAGS $ROOT_TAG"
            fi
          fi

          echo "MANIFEST_TAGS=$MANIFEST_TAGS" >> $GITHUB_ENV
      - name: Sign multi-arch manifest(s)
        env:
          DEVGUARD_TOKEN: ${{ secrets.devguard-token }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
        run: |-
          for TAG in $MANIFEST_TAGS; do
            echo "Signing manifest: $TAG"
            docker run --rm ghcr.io/l3montree-dev/devguard/scanner:main devguard-scanner sign -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --token="$DEVGUARD_TOKEN" "$TAG" --offline
          done
      - name: Download amd64 oci-image
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}-amd64
          path: amd64
      - name: Download arm64 oci-image
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: oci-image${{ inputs.image-suffix }}-arm64
          path: arm64
      - name: Generate, sign and attach build provenance of the multi-arch manifest(s)
        env:
          DEVGUARD_API_URL: ${{ inputs.devguard-api-url }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USER: ${{ inputs.registry-user }}
          IMAGE_TARS: amd64/image.tar arm64/image.tar
        run: |-
          AUDIENCE=$(jq -rn --arg audience "$DEVGUARD_API_URL" '$audience | @uri')
          DEVGUARD_ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$DEVGUARD_ID_TOKEN"
          export DEVGUARD_ID_TOKEN

          cat > index-provenance.sh << 'PROVENANCE_SCRIPT'
          set -eu

          crane auth login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

          # images are matched by their config digest - see the provenance job
          tarball_config_digest() {
            CONFIG=$(tar -xOf "$1" manifest.json | jq -r '.[0].Config')
            echo "sha256:$(tar -xOf "$1" "$CONFIG" | sha256sum | cut -d' ' -f1)"
          }
          sorted() {
            printf '%s\n' "$@" | sort | tr '\n' ' '
          }

          BUILT_CONFIGS=""
          for TAR in $IMAGE_TARS; do
            BUILT_CONFIGS="$BUILT_CONFIGS $(tarball_config_digest "$TAR")"
          done
          EXPECTED_CONFIGS=$(sorted $BUILT_CONFIGS)

          INDEX_REFS=""
          for TAG in $MANIFEST_TAGS; do
            IMAGE_REF=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="${IMAGE_REF%@*}"
            IMAGE_NAME="${IMAGE_NAME%:*}"
            # resolved once - everything below refers to the digest
            INDEX_REF="$IMAGE_NAME@$(crane digest "$IMAGE_REF")"

            # the index is only attested if it references exactly the built images
            LISTED_CONFIGS=""
            for DIGEST in $(crane manifest "$INDEX_REF" | jq -r '.manifests[].digest'); do
              LISTED_CONFIGS="$LISTED_CONFIGS $(crane manifest "$IMAGE_NAME@$DIGEST" | jq -r '.config.digest')"
            done
            LISTED_CONFIGS=$(sorted $LISTED_CONFIGS)
            if [ "$LISTED_CONFIGS" != "$EXPECTED_CONFIGS" ]; then
              echo "$TAG references images with the configs $LISTED_CONFIGS but the build produced $EXPECTED_CONFIGS" >&2
              exit 1
            fi

            # the root tag points to the same index - attest it once
            case " $INDEX_REFS " in
              *" $INDEX_REF "*) ;;
              *) INDEX_REFS="$INDEX_REFS $INDEX_REF" ;;
            esac
          done

          for INDEX_REF in $INDEX_REFS; do
            devguard-scanner provenance generate --image "$INDEX_REF" --output index-provenance.json
            devguard-scanner provenance sign index-provenance.json --apiUrl "$DEVGUARD_API_URL" --output index-provenance.dsse.json
            echo "Attaching build provenance to $INDEX_REF"
            devguard-scanner attest index-provenance.dsse.json "$INDEX_REF" --predicateType=https://slsa.dev/provenance/v1 -u "$REGISTRY_USER" -r "$REGISTRY" -p "$REGISTRY_PASSWORD" --offline
          done
          PROVENANCE_SCRIPT

          # run as the runner user - the scanner image user can not write to the workspace
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e IMAGE_TARS -e MANIFEST_TAGS \
            -e DEVGUARD_ID_TOKEN -e DEVGUARD_API_URL -e REGISTRY -e REGISTRY_USER -e REGISTRY_PASSWORD \
            --entrypoint sh ghcr.io/l3montree-dev/devguard/scanner:main index-provenance.sh
      - name: Download amd64 artifact purl (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl${{ inputs.image-suffix }}-amd64
          path: amd64
        if: inputs.devguard-artifact-name == ''
      - name: Download amd64 safe-artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl-safe${{ inputs.image-suffix }}-amd64
          path: amd64
        if: inputs.devguard-artifact-name == ''
      - name: Download arm64 artifact purl (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl${{ inputs.image-suffix }}-arm64
          path: arm64
        if: inputs.devguard-artifact-name == ''
      - name: Download arm64 safe-artifact (can be created by build-image)
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: artifact-purl-safe${{ inputs.image-suffix }}-arm64
          path: arm64
        if: inputs.devguard-artifact-name == ''
      - name: set amd64 artifact-name variable if it is empty
        env:
          DEVGUARD_ARTIFACT_NAME: ${{ inputs.devguard-artifact-name }}
        run: |-
          if [ -z "$DEVGUARD_ARTIFACT_NAME" ] && [ -f amd64/artifact-purl.txt ]; then
            if [ -f amd64/artifact-purl-safe.txt ]; then
              echo "AMD64_API_ARTIFACT_NAME=$(cat amd64/artifact-purl-safe.txt)" >> $GITHUB_ENV
            else
              echo "AMD64_API_ARTIFACT_NAME=$(cat amd64/artifact-purl.txt)" >> $GITHUB_ENV
            fi
            echo "Using artifact name from file: $(cat amd64/artifact-purl.txt)"
          else
            echo "AMD64_API_ARTIFACT_NAME=$(echo -n "$DEVGUARD_ARTIFACT_NAME" | jq -s -R -r @uri)" >> $GITHUB_ENV
            echo "Using provided artifact name: $DEVGUARD_ARTIFACT_NAME"
          fi
      - name: set arm64 artifact-name variable if it is empty
        env:
          DEVGUARD_ARTIFACT_NAME: ${{ inputs.devguard-artifact-name }}
        run: |-
          if [ -z "$DEVGUARD_ARTIFACT_NAME" ] && [ -f arm64/artifact-purl.txt ]; then
            if [ -f arm64/artifact-purl-safe.txt ]; then
              echo "ARM64_API_ARTIFACT_NAME=$(cat arm64/artifact-purl-safe.txt)" >> $GITHUB_ENV
            else
              echo "ARM64_API_ARTIFACT_NAME=$(cat arm64/artifact-purl.txt)" >> $GITHUB_ENV
            fi
            echo "Using artifact name from file: $(cat arm64/artifact-purl.txt)"
          else
            echo "ARM64_API_ARTIFACT_NAME=$(echo -n "$DEVGUARD_ARTIFACT_NAME" | jq -s -R -r @uri)" >> $GITHUB_ENV
            echo "Using provided artifact name: $DEVGUARD_ARTIFACT_NAME"
          fi
      - name: Get and Attest amd64 SBOM
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              echo 'Fetching SBOM for artifact:' '${{ env.AMD64_API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.AMD64_API_ARTIFACT_NAME }}/sbom.json/' --token='${{ secrets.devguard-token }}' > /tmp/amd64.sbom.json &&
              echo 'SBOM downloaded to /tmp/amd64.sbom.json' &&
              for TAG in $MANIFEST_TAGS; do
                echo 'Attesting amd64 SBOM for manifest:' \"$TAG\" &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/amd64.sbom.json --predicateType='https://cyclonedx.org/bom' \"$TAG\" --token='${{ secrets.devguard-token }}' --offline
              done
            "
        env:
          AMD64_API_ARTIFACT_NAME: ${{ env.AMD64_API_ARTIFACT_NAME }}
          MANIFEST_TAGS: ${{ env.MANIFEST_TAGS }}
      - name: Get and Attest amd64 VeX
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              echo 'Fetching VeX for artifact:' '${{ env.AMD64_API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.AMD64_API_ARTIFACT_NAME }}/vex.json/' --token='${{ secrets.devguard-token }}' > /tmp/amd64.vex.json &&
              echo 'VeX downloaded to /tmp/amd64.vex.json' &&
              for TAG in $MANIFEST_TAGS; do
                echo 'Attesting amd64 VeX for manifest:' \"$TAG\" &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/amd64.vex.json \"$TAG\" --token='${{ secrets.devguard-token }}' --predicateType='https://cyclonedx.org/vex' --offline
              done
            "
        env:
          AMD64_API_ARTIFACT_NAME: ${{ env.AMD64_API_ARTIFACT_NAME }}
          MANIFEST_TAGS: ${{ env.MANIFEST_TAGS }}
      - name: Get and Attest arm64 SBOM
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              echo 'Fetching SBOM for artifact:' '${{ env.ARM64_API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.ARM64_API_ARTIFACT_NAME }}/sbom.json/' --token='${{ secrets.devguard-token }}' > /tmp/arm64.sbom.json &&
              echo 'SBOM downloaded to /tmp/arm64.sbom.json' &&
              for TAG in $MANIFEST_TAGS; do
                echo 'Attesting arm64 SBOM for manifest:' \"$TAG\" &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/arm64.sbom.json --predicateType='https://cyclonedx.org/bom' \"$TAG\" --token='${{ secrets.devguard-token }}' --offline
              done
            "
        env:
          ARM64_API_ARTIFACT_NAME: ${{ env.ARM64_API_ARTIFACT_NAME }}
          MANIFEST_TAGS: ${{ env.MANIFEST_TAGS }}
      - name: Get and Attest arm64 VeX
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              echo 'Fetching VeX for artifact:' '${{ env.ARM64_API_ARTIFACT_NAME }}' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/artifacts/${{ env.ARM64_API_ARTIFACT_NAME }}/vex.json/' --token='${{ secrets.devguard-token }}' > /tmp/arm64.vex.json &&
              echo 'VeX downloaded to /tmp/arm64.vex.json' &&
              for TAG in $MANIFEST_TAGS; do
                echo 'Attesting arm64 VeX for manifest:' \"$TAG\" &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/arm64.vex.json \"$TAG\" --token='${{ secrets.devguard-token }}' --predicateType='https://cyclonedx.org/vex' --offline
              done
            "
        env:
          ARM64_API_ARTIFACT_NAME: ${{ env.ARM64_API_ARTIFACT_NAME }}
          MANIFEST_TAGS: ${{ env.MANIFEST_TAGS }}
      - name: Get and Attest SAST-Results
        uses: docker://ghcr.io/l3montree-dev/devguard/scanner:main
        with:
          args: |-
            sh -c "
              slug=$(devguard-scanner slug ${{ inputs.commit-ref }}) &&
              echo 'Fetching SAST results' &&
              devguard-scanner curl '${{ inputs.devguard-api-url }}/api/v1/organizations/${{ inputs.devguard-asset-name }}/refs/'$slug'/sarif.json' --token='${{ secrets.devguard-token }}' > /tmp/sarif.json &&
              echo 'SAST results downloaded to /tmp/sarif.json' &&
              for TAG in $MANIFEST_TAGS; do
                echo 'Attesting SAST results for manifest:' \"$TAG\" &&
                devguard-scanner attest -u ${{ inputs.registry-user }} -r ${{ inputs.registry }} -p "${{ env.REGISTRY_PASSWORD }}" /tmp/sarif.json \"$TAG\" --predicateType='https://www.schemastore.org/schemas/json/sarif-2.1.0.json' --token='${{ secrets.devguard-token }}' --offline
              done
            "
        env:
          MANIFEST_TAGS: ${{ env.MANIFEST_TAGS }}
    name: devguard:create-manifest-multi-arch
